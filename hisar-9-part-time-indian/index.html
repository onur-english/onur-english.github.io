<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Absolutely True Diary of a Part-Time Indian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* === THEME === */
:root{
  --paper:#fbf8ef;
  --rule:#d6e4f2;
  --margin:#eaa7a1;
  --ink:#1d2a44;
  --muted:#5d6679;
  --ball:#e0702a;
  --ball-dark:#b8561b;
  --teal:#1f7f86;
  --teal-soft:#e2f2f2;
  --card:#ffffff;
  --good:#2b8a57;
  --good-bg:#e4f4ea;
  --bad:#c0392b;
  --bad-bg:#fbe8e5;
  --tape:rgba(224,112,42,.28);
  --shadow:0 6px 18px rgba(29,42,68,.12);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif;
  color:var(--ink);
  background:
    repeating-linear-gradient(to bottom, var(--paper) 0 31px, var(--rule) 31px 32px);
  min-height:100vh;
  line-height:1.5;
}
body::before{ /* red margin line of a diary page */
  content:"";position:fixed;top:0;bottom:0;left:22px;width:2px;
  background:var(--margin);opacity:.7;pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 60px 34px}

/* === HEADER === */
.cover{
  background:var(--ink);color:#fff;
  border-radius:0 0 var(--radius) var(--radius);
  padding:22px 22px 18px;margin:0 -16px 0 -34px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.cover::after{ /* basketball seam lines, CSS only */
  content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;
  background:var(--ball);
  box-shadow:inset 0 0 0 3px var(--ball-dark);
  opacity:.9;
}
.cover::before{
  content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;
  background:
    linear-gradient(90deg,transparent 48.5%,var(--ink) 48.5% 51.5%,transparent 51.5%),
    linear-gradient(0deg,transparent 48.5%,var(--ink) 48.5% 51.5%,transparent 51.5%);
  z-index:1;opacity:.85;
}
.cover h1{
  font-family:"Permanent Marker",cursive;font-weight:400;
  font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.15;margin:0 0 6px;
  max-width:78%;position:relative;z-index:2;
}
.brand{display:inline-block;background:#fff;border-radius:10px;padding:4px 6px;margin-bottom:10px;position:relative;z-index:2}
.brand img{width:68px;height:auto;display:block}
.cover p{margin:0;font-family:"Kalam",cursive;font-size:1.05rem;opacity:.9;position:relative;z-index:2;max-width:78%}
.name-row{display:flex;gap:8px;align-items:center;margin-top:14px;position:relative;z-index:2;flex-wrap:wrap}
.name-row label{font-weight:700;font-size:.95rem}
.name-row input{
  flex:1;min-width:160px;max-width:320px;padding:9px 12px;border-radius:10px;border:2px solid transparent;
  font:inherit;color:var(--ink);background:#fff;
}
.name-row input:focus{outline:none;border-color:var(--ball)}

/* === TABS === */
.tabs{
  position:sticky;top:0;z-index:5;display:flex;gap:6px;
  padding:12px 0 10px;background:linear-gradient(var(--paper) 80%,rgba(251,248,239,0));
}
.tab{
  flex:1;border:2px solid var(--ink);background:#fff;color:var(--ink);
  font:700 .92rem "Nunito",sans-serif;padding:9px 6px;border-radius:999px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab small{display:block;font-weight:600;font-size:.72rem;opacity:.8}

/* === CARDS === */
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 18px;margin:14px 0;position:relative;
}
.card.taped::before{
  content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:96px;height:22px;background:var(--tape);border-radius:3px;
}
.hand{font-family:"Kalam",cursive}
.part-label{
  display:inline-block;font-family:"Kalam",cursive;font-weight:700;color:var(--teal);
  background:var(--teal-soft);border-radius:999px;padding:2px 12px;font-size:.92rem;
}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.counter{font-size:.88rem;color:var(--muted);font-weight:700}
.progress{height:10px;border-radius:999px;background:#eef0f4;overflow:hidden;margin:8px 0 14px}
.progress span{display:block;height:100%;background:var(--ball);border-radius:999px;transition:width .35s ease}
.question{font-size:1.15rem;font-weight:800;margin:6px 0 14px}

/* === OPTIONS === */
.options{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:2px solid #d9dde6;border-radius:12px;padding:12px 14px;
  font:600 1rem "Nunito",sans-serif;color:var(--ink);cursor:pointer;
}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt .letter{
  flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:#eef0f4;font-weight:800;font-size:.9rem;
}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .letter{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}

.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:600}
.feedback.good{background:var(--good-bg);border-left:6px solid var(--good)}
.feedback.bad{background:var(--bad-bg);border-left:6px solid var(--bad)}
.feedback strong{display:block;margin-bottom:4px}
.feedback .why{font-weight:500;margin-top:6px}

/* === BUTTONS === */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:999px;padding:11px 20px;font:800 1rem "Nunito",sans-serif;
  cursor:pointer;background:var(--ball);color:#fff;box-shadow:0 3px 0 var(--ball-dark);
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ball-dark)}
.btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 #155a5f}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* === ROUND / FINISH SCREENS === */
.big{font-family:"Permanent Marker",cursive;font-size:1.6rem;font-weight:400;margin:0 0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--teal-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem}

/* === WRITING === */
.tip-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.tip-steps div{background:var(--teal-soft);border-radius:10px;padding:8px 10px;font-weight:700;font-size:.92rem}
.tip-steps div span{display:block;font-family:"Kalam",cursive;color:var(--teal);font-size:1rem}
.wq-num{
  font-family:"Permanent Marker",cursive;color:var(--ball);font-size:1.25rem;margin-right:6px;
}
.wq-prompt{font-size:1.08rem;font-weight:800;margin:4px 0 10px}
textarea{
  width:100%;min-height:170px;resize:vertical;border:2px solid #d9dde6;border-radius:12px;
  padding:12px;font:500 1rem/1.6 "Nunito",sans-serif;color:var(--ink);
  background:repeating-linear-gradient(to bottom,#fff 0 25px,#eef3f9 25px 26px);
  background-attachment:local;
}
textarea:focus{outline:none;border-color:var(--teal)}
.wc{font-size:.85rem;color:var(--muted);font-weight:700;margin-top:4px}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.checks li{border-radius:10px;padding:8px 12px;font-weight:700}
.checks li.ok{background:var(--good-bg)}
.checks li.miss{background:var(--bad-bg)}
.checks li small{display:block;font-weight:500}
.model{
  margin-top:14px;border:2px dashed var(--teal);border-radius:12px;padding:12px 14px;background:#f7fbfb;
}
.model h4{margin:0 0 6px;font-family:"Kalam",cursive;color:var(--teal);font-size:1.1rem}
.model p{margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols h5{margin:0 0 4px;font-size:.92rem}
.cols ul{margin:0;padding-left:18px;font-size:.93rem}
@media (max-width:560px){ .cols{grid-template-columns:1fr} }

/* === REPORT === */
.report-box{
  white-space:pre-wrap;font:500 .9rem/1.5 ui-monospace,Menlo,Consolas,monospace;
  background:#f6f7fa;border-radius:12px;padding:12px;max-height:340px;overflow:auto;border:1px solid #e1e4ea;
}
.note{font-size:.92rem;color:var(--muted)}
.hidden{display:none !important}


/* === ADDED: 4 TABS, SIDE TOGGLE, PEA LABELS === */
.tab{font-size:.85rem;padding:8px 4px}
.tab small{font-size:.68rem}
.side-toggle{display:flex;gap:8px;margin:4px 0 10px}
.side-btn{flex:1;border:2px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;padding:8px 10px;font:800 .95rem "Nunito",sans-serif;cursor:pointer}
.side-btn[aria-pressed="true"]{background:var(--teal);color:#fff}
.task{margin:4px 0 10px;font-weight:600}
.model h5{margin:6px 0 4px;font-size:.92rem}
.model ul{margin:0;padding-left:18px;font-size:.93rem}
.pea-line{display:block}
.pea-line b{display:inline-block;min-width:74px;margin-right:6px;border-radius:6px;padding:0 6px;font-size:.82rem;color:#fff;text-align:center}
.tag-p{background:var(--ink)} .tag-e{background:var(--ball)} .tag-a{background:var(--teal)}

/* === PRINT === */
@media print{
  body{background:#fff}
  body::before,.tabs,.btn,.btn-row,.name-row input{display:none !important}
  .cover{background:#fff;color:#000;box-shadow:none}
  .cover::before,.cover::after{display:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .panel{display:block !important}
}
</style>
</head>

    { id:"q43", part:"Junior's voice and cartoons",

      answer:0,

    { id:"q06", part:"Life on the reservation",

      why:"Rowdy was born on the same day as Junior. He is angry and tough, partly because of his violent, drunk father, but he protects Junior." },

    { id:"q08", part:"Life on the reservation",

      answer:3,
      why:"The book once belonged to his mother. Junior is furious that his school is so poor it still uses books that old." },

    { id:"q10", part:"Life on the reservation",

    { id:"q11", part:"Life on the reservation",

  /* 10 writing topics. In the exam students write ONE paragraph: an advantage OR a disadvantage. */
  writing: [
    { id:"w01", topic:"Junior leaving Wellpinit to go to school in Reardan",

        examples:["Rowdy punches him and stops being his friend","The Wellpinit crowd turns their backs on him","He is ignored and lonely at Reardan at first"] } },

        examples:["Classmates assume he has money and don't pity him","His father's old suit is seen as cool and retro","He has time to build friendships with Penelope and Roger"] },
      dis:{
        model:"A big disadvantage of Junior hiding his poverty is that it makes him anxious and alone. Before the Winter Formal, Junior has only five dollars, so he has to meet Penelope at the dance instead of picking her up. Later, at the diner, he feels sick because he cannot pay, and he lies that he forgot his wallet. This shows how much stress the secret causes him. Roger lends him forty dollars, and afterward Penelope asks if he is poor. When Junior finally admits the truth, things get better, and Roger often drives him home after that. This proves that the secret was hurting him more than the truth ever could. Overall, hiding his poverty only makes Junior's life harder.",
        examples:["He has only five dollars for the Winter Formal","He feels sick at the diner and lies about his wallet","After he admits the truth, Roger drives him home"] } },

    { id:"w04", topic:"Growing up in a close community like the Spokane reservation",

        model:"One important advantage of growing up on the Spokane reservation is the strong sense of community. When Grandmother Spirit dies, about two thousand people come to her wake, and her coffin has to be moved to a football field. This shows how much the community values its people. Even in grief, the community can share joy: when a rich collector named Ted arrives with a dance outfit that was never hers, the whole crowd bursts out laughing together. This proves that the tribe has its own humor and strength. The grandmother herself also shows the community's best values, such as tolerance and forgiveness. Overall, the reservation gives Junior a powerful identity and a feeling of belonging that he cannot find anywhere else.",

      dis:{

        examples:["No money for a vet: Oscar is shot","Alcohol kills the grandmother, Eugene and Mary","People call Junior a traitor for leaving"] } },

    { id:"w05", topic:"Junior telling his story through cartoons as well as words",

      adv:{
        model:"One advantage of Junior telling his story through cartoons is that drawing helps him express what words cannot. Junior says he draws because words are \"too unpredictable\" and \"too limited,\" while anyone can understand a picture. This shows that his cartoons can reach every reader, whatever language they speak. His drawings also reveal his feelings clearly. For example, at Thanksgiving he draws himself and Rowdy as superheroes, which shows how much he wants their friendship back. In addition, the cartoon of a boy split into a white half and an Indian half quickly shows how unequal he thinks the two worlds are. Therefore, the cartoons make Junior's story clearer, funnier and more emotional than words alone could.",
        examples:["Words are \"too unpredictable\" and \"too limited\"","The superhero cartoon of Junior and Rowdy","The boy split into a white half and an Indian half"] },
      dis:{

        examples:["Jokes can make poverty and racism seem lighter","The split cartoon sorts people into fixed types","Rowdy's father mocks the superhero cartoon"] } },

    { id:"w07", topic:"Mary leaving the reservation to start a new life in Montana",

      adv:{
        model:"One clear advantage of Mary leaving the reservation is that she finally escapes the life that was trapping her. For years she hid in the family basement, but after Junior goes to Reardan, she marries a man she met at a casino and moves to Montana. This shows that she is brave enough to change her life. Her emails show that she is happy and excited: she rides a horse for the first time and loves her new home. She even starts writing the story of her life, which brings back her old dream of writing. This proves that leaving gives Mary hope again. Overall, Mary's choice shows that leaving can help a person begin to chase their dreams.",

    { id:"w08", topic:"Mr. P being completely honest with Junior",

/* Words that show the student used a detail from the novel (lenient check). */
const NOVEL_WORDS = ["junior","arnold","rowdy","reardan","wellpinit","penelope","gordy","roger","mr. p","mr p",
  "mary","eugene","grandmother","oscar","coach","basketball","reservation","rez","powwow","ted","dodge",
  "montana","cartoon","spokane","mother","father","dad","mom","andruss","dawn","winter formal","thanksgiving"];

/* === STATE === */
let state = freshState();

function freshState(){
  return {
    name: "",
    tab: "mcq",
    mcq: freshMcq(),
    pea: {},             // id -> { text, checked }
    writing: {}          // "w01-adv" / "w01-dis" -> { text, checked }
  };
}
function freshMcq(){
  return {
    round: 1,
    queue: APP.questions.map(q => q.id),
    idx: 0,
    firstTry: {},
    solved: {},
    missedThisRound: [],
    current: null,
    roundSummary: null,
    finished: false
  };
}

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.mcq && s.writing && s.pea) state = s;
    }
  } catch(e) {}
}

/* === HELPERS === */
const $ = sel => document.querySelector(sel);
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function qById(id){ return APP.questions.find(q => q.id === id); }
function wordCount(t){ return (t || "").trim().split(/\s+/).filter(Boolean).length; }
function hasNovelDetail(text, extra){
  const lower = (text || "").toLowerCase();
  return extra.concat(NOVEL_WORDS).some(k => lower.includes(k));
}
function countNovelDetails(text, extra){
  const lower = (text || "").toLowerCase();
  const all = Array.from(new Set(extra.concat(NOVEL_WORDS)));
  return all.filter(k => lower.includes(k)).length;
}
function firstSentence(text){
  const t = (text || "").trim().replace(/\b(Mr|Mrs|Ms|Dr)\./g, "$1");
  const m = t.match(/^[^.!?]*[.!?]?/);
  return m ? m[0] : t;
}
const LETTERS = ["A","B","C","D"];
const ANALYSIS_RE = /\b(this shows|this suggests|this means|this proves|this reveals|this tells|which shows|which means|which suggests|shows that|suggests that|proves that|reveals that|because|as a result|so that)\b/i;

/* === TABS === */
const TABS = ["mcq","pea","write","report"];
function showTab(name){
  state.tab = name;
  TABS.forEach(t => {
    $("#tab-" + t).setAttribute("aria-selected", String(t === name));
    $("#panel-" + t).classList.toggle("hidden", t !== name);
  });
  if (name === "report") renderReport();
  save();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* === MULTIPLE CHOICE (mastery loop) === */
function renderMCQ(){
  const m = state.mcq;
  const panel = $("#panel-mcq");
  const total = APP.questions.length;
  const solvedCount = Object.keys(m.solved).length;
  const pct = Math.round(solvedCount / total * 100);

  if (m.finished) {
    const first = Object.values(m.firstTry).filter(Boolean).length;
    panel.innerHTML = `
      <div class="card taped">
        <h2 class="big">All ${total} questions solved!</h2>
        <p>You worked through every question until you got it right.</p>
        <div class="stats">
          <div class="stat"><b>${first}/${total}</b>right the first time</div>
          <div class="stat"><b>${m.round}</b>round${m.round > 1 ? "s" : ""} needed</div>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="showTab('pea')">Go to exam reading answers</button>
          <button class="btn secondary" onclick="restartMCQ()">Practice the 40 again</button>
        </div>
      </div>`;
    return;
  }

  if (m.roundSummary) {
    const r = m.roundSummary;
    panel.innerHTML = `
      <div class="card taped">
        <h2 class="big">Round ${r.round} done</h2>
        <p>You got <strong>${r.right}</strong> of ${r.asked} right in this round.</p>
        <p>Now practice the <strong>${r.missed}</strong> question${r.missed > 1 ? "s" : ""} you missed. They will keep coming back until you get them right.</p>
        <div class="btn-row"><button class="btn" onclick="startNextRound()">Start round ${r.round + 1}</button></div>
      </div>`;
    return;
  }

  const id = m.queue[m.idx];
  if (!m.current || m.current.id !== id) {
    m.current = { id, order: shuffle([0,1,2,3]), picked: null };
    save();
  }
  const q = qById(id);
  const cur = m.current;
  const answered = cur.picked !== null;

  const optsHtml = cur.order.map((optIndex, pos) => {
    let cls = "opt";
    if (answered) {
      if (optIndex === q.answer) cls += " correct";
      else if (optIndex === cur.picked) cls += " wrong";
    }
    return `<button class="${cls}" ${answered ? "disabled" : ""} onclick="pickOption(${optIndex})">
              <span class="letter">${LETTERS[pos]}</span><span>${esc(q.options[optIndex])}</span>
            </button>`;
  }).join("");

  let fb = "";
  if (answered) {
    const right = cur.picked === q.answer;
    fb = right
      ? `<div class="feedback good" role="status"><strong>Correct!</strong><div class="why">${esc(q.why)}</div></div>`
      : `<div class="feedback bad" role="status"><strong>Not quite. The correct answer is:</strong>${esc(q.options[q.answer])}<div class="why">${esc(q.why)}</div></div>`;
  }

  panel.innerHTML = `
    <div class="card taped">
      <div class="meta">
        <span class="part-label">${esc(q.part)}</span>
        <span class="counter">Round ${m.round} · ${m.idx + 1} of ${m.queue.length}</span>
      </div>
      <div class="counter">Solved: ${solvedCount}/${total}</div>
      <div class="progress" aria-hidden="true"><span style="width:${pct}%"></span></div>
      <p class="question">${esc(q.q)}</p>
      <div class="options">${optsHtml}</div>
      ${fb}
      ${answered ? `<div class="btn-row"><button class="btn" id="nextBtn" onclick="nextQuestion()">Next</button></div>` : ""}
    </div>`;
  if (answered) { const n = $("#nextBtn"); if (n) n.focus({ preventScroll: true }); }
}

function pickOption(optIndex){
  const m = state.mcq;
  const cur = m.current;
  if (!cur || cur.picked !== null) return;
  cur.picked = optIndex;
  const q = qById(cur.id);
  const right = optIndex === q.answer;
  if (!(cur.id in m.firstTry)) m.firstTry[cur.id] = right;
  if (right) m.solved[cur.id] = true;
  else m.missedThisRound.push(cur.id);
  save();
  renderMCQ();
}

function nextQuestion(){
  const m = state.mcq;
  m.idx++;
  m.current = null;
  if (m.idx >= m.queue.length) {
    if (m.missedThisRound.length) {
      m.roundSummary = {
        round: m.round,
        asked: m.queue.length,
        right: m.queue.length - m.missedThisRound.length,
        missed: m.missedThisRound.length
      };
    } else {
      m.finished = true;
    }
  }
  save();
  renderMCQ();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startNextRound(){
  const m = state.mcq;
  m.round++;
  m.queue = shuffle(m.missedThisRound);
  m.missedThisRound = [];
  m.idx = 0;
  m.current = null;
  m.roundSummary = null;
  save();
  renderMCQ();
}

function restartMCQ(){
  if (!confirm("Start the 40 questions again? Your multiple-choice results will be cleared. Your written answers stay.")) return;
  state.mcq = freshMcq();
  save();
  renderMCQ();
}

/* === EXAM READING: POINT, EVIDENCE, ANALYSIS === */
function peaChecks(item, text){
  const t = text || "";
  const hasQuoteOrExample = /["“”]|for example|for instance|when |at the |in the novel|in chapter/i.test(t);
  return [
    { label:"Point", ok: wordCount(firstSentence(t)) >= 6,
      tip:"Start with one clear sentence that answers the question." },
    { label:"Evidence", ok: hasNovelDetail(t, item.keywords.concat([])) && (hasQuoteOrExample || countNovelDetails(t, item.keywords) >= 2),
      tip:"Support your point with a specific moment or a short quotation from the novel." },
    { label:"Analysis", ok: ANALYSIS_RE.test(t),
      tip:"Explain how your evidence proves your point (e.g. \"This shows that…\")." },
    { label:"Length", ok: wordCount(t) >= 50,
      tip:"Aim for at least 50 words so you can explain properly." }
  ];
}

/* === WRITING: ONE ADVANTAGE OR DISADVANTAGE PARAGRAPH === */
const ADV_RE = /\b(advantages?|benefits?|positive|good|helps?|helped|helpful|gains?|opportunit\w*|strength|better)\b/i;
const DIS_RE = /\b(disadvantages?|drawbacks?|downside|negative|problems?|costs?|loses?|lost|hurts?|harm\w*|difficult|painful|dangerous|worse|risks?)\b/i;
const CONCLUDE_RE = /\b(overall|in conclusion|to conclude|clearly|therefore|this proves|in the end|all in all|to sum up)\b/i;

function writingChecks(w, side, text){
  const t = text || "";
  const sideRe = side === "adv" ? ADV_RE : DIS_RE;
  const details = countNovelDetails(t, w.keywords);
  return [
    { label: side === "adv" ? "Point: you name an advantage" : "Point: you name a disadvantage",
      ok: sideRe.test(firstSentence(t)),
      tip: side === "adv"
        ? "Open with a topic sentence that clearly states one advantage."
        : "Open with a topic sentence that clearly states one disadvantage." },
    { label:"Two examples from the novel", ok: details >= 2,
      tip:"You can't use your book in the exam, so give at least two specific examples you remember (characters, places, events)." },
    { label:"Explanation of your examples", ok: ANALYSIS_RE.test(t),
      tip:"After each example, explain what it shows (e.g. \"This shows that…\", \"This proves that…\")." },
    { label:"Concluding sentence", ok: CONCLUDE_RE.test(t),
      tip:"End with a sentence that sums up your point (e.g. \"Overall…\", \"Clearly…\")." },
    { label:`Length (${wordCount(t)} words)`, ok: wordCount(t) >= 100,
      tip:"This is a 30-mark paragraph. Aim for about 120–180 words so both examples are fully explained." }
  ];
}

function sideHtml(w, side){
  const key = w.id + "-" + side;
  const saved = state.writing[key] || { text: "", checked: false };
  const topic = /^(Having|Growing|Being)\b/.test(w.topic) ? w.topic.charAt(0).toLowerCase() + w.topic.slice(1) : w.topic;
  const task = `Write a paragraph about one <strong>${side === "adv" ? "advantage" : "disadvantage"}</strong> of ${esc(topic)}.`;
  return `
    <p class="task">${task}</p>
    <textarea id="ta-${key}" aria-label="Your paragraph" placeholder="Write your paragraph here..."
      oninput="onWriteInput('${key}')">${esc(saved.text)}</textarea>

    <div id="fb-${key}">${saved.checked ? writingFeedbackHtml(w, side, saved.text) : ""}</div>`;

function setSide(id, side){

function onWriteInput(key){

function checkWriting(id, side){

function writingFeedbackHtml(w, side, text){

/* === REPORT === */
let copied = false;

function buildReport(){
  const m = state.mcq;
  const total = APP.questions.length;
  const first = Object.values(m.firstTry).filter(Boolean).length;
  const attempted = Object.keys(m.firstTry).length;
  const solved = Object.keys(m.solved).length;
  const missedFirst = APP.questions.filter(q => m.firstTry[q.id] === false);

  let r = "";
  r += `Name: ${state.name || "(no name)"}\n`;
  r += `App: ${APP.title}\n`;
  r += `Date: ${new Date().toLocaleString()}\n\n`;

  r += `MULTIPLE CHOICE\n`;
  r += `Right the first time: ${first}/${total}\n`;
  r += `Answered at least once: ${attempted}/${total}\n`;
  r += `Solved (after practice rounds): ${solved}/${total}\n`;
  r += `Rounds: ${m.round}${m.finished ? " (finished)" : " (not finished)"}\n`;
  if (missedFirst.length) {
    r += `Missed the first time:\n`;
    missedFirst.forEach(q => { r += `  - ${q.q}\n`; });
  }

  r += `\nEXAM READING ANSWERS (Point, Evidence, Analysis)\n`;
  APP.pea.forEach((p, i) => {
    const e = state.pea[p.id];
    const text = e && e.text.trim() ? e.text.trim() : "";
    if (!text) return;
    const res = peaChecks(p, text);
    r += `\n${i + 1}. ${p.q}\n`;
    r += `Checks: ${res.map(x => (x.ok ? "✓ " : "✗ ") + x.label).join(" | ")} | ${wordCount(text)} words\n`;
    r += `${text}\n`;
  });
  if (!APP.pea.some(p => state.pea[p.id] && state.pea[p.id].text.trim())) r += `(none answered yet)\n`;

  r += `\nWRITING (advantage or disadvantage paragraph)\n`;
  let any = false;
  APP.writing.forEach((w, i) => {
    ["adv","dis"].forEach(side => {
      const e = state.writing[w.id + "-" + side];
      const text = e && e.text.trim() ? e.text.trim() : "";
      if (!text) return;
      any = true;
      const res = writingChecks(w, side, text);
      r += `\n${i + 1}. ${side === "adv" ? "ADVANTAGE" : "DISADVANTAGE"}: ${w.topic}\n`;
      r += `Checks: ${res.map(x => (x.ok ? "✓ " : "✗ ") + x.label).join(" | ")}\n`;
      r += `${text}\n`;
    });
  });
  if (!any) r += `(none written yet)\n`;
  return r;
}

function renderReport(){
  copied = false;
  const panel = $("#panel-report");
  panel.innerHTML = `
    <div class="card taped">
      <h2 class="big">Send to my teacher</h2>
      <p><strong>Step 1:</strong> Copy your report. <strong>Step 2:</strong> Open WhatsApp and paste it.</p>

      <div class="btn-row">
        <button class="btn" id="copyBtn" onclick="copyReport()">Copy my report</button>
        <button class="btn teal" id="waBtn" onclick="openWhatsApp()" disabled>Open WhatsApp</button>
      </div>
      <h3 class="hand" style="margin:18px 0 6px">Your report</h3>
      <div class="report-box" id="reportBox">${esc(buildReport())}</div>
    </div>
    <div class="card">
      <p class="note">Want to start everything again? This clears your multiple-choice results and all your written answers.</p>
      <button class="btn secondary" onclick="resetAll()">Start again</button>

function copyReport(){
  const text = buildReport();
  const done = () => {
    copied = true;
    $("#copyBtn").textContent = "Copied ✓";
    $("#waBtn").disabled = false;
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
  if (ok) { done(); return; }
  alert("Copying didn't work on this device. Please select the report text, copy it, and then open WhatsApp.");
  copied = true;
  $("#waBtn").disabled = false;
}
function openWhatsApp(){
  if (!copied) return;
  const line = `Hi! Here is my report for ${APP.title}${state.name ? " - " + state.name : ""}. (pasted below)`;
  window.open(`https://wa.me/${TEACHER_WHATSAPP}?text=${encodeURIComponent(line)}`, "_blank");
}

function resetAll(){
  if (!confirm("Are you sure? This deletes your multiple-choice results AND all your written answers.")) return;
  const name = state.name;
  state = freshState();
  state.name = name;
  state.tab = "report";
  save();
  renderMCQ();
  renderPEA();
  renderWriting();
  renderReport();
}

/* === START === */
function init(){
  load();
  $("#appTitle").textContent = APP.title;
  $("#appSub").textContent = APP.subtitle;
  const nameInput = $("#studentName");
  nameInput.value = state.name || "";
  nameInput.addEventListener("input", () => {
    state.name = nameInput.value.trim();
    save();
    if (state.tab === "report") renderReport();
  });
  TABS.forEach(t => $("#tab-" + t).addEventListener("click", () => showTab(t)));
  renderMCQ();
  renderPEA();
  renderWriting();
  showTab(TABS.includes(state.tab) ? state.tab : "mcq");
}
init();
</script>
</body>
</html>
