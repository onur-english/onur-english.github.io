<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Pen · Q1 Writing Exam</title>
<meta name="theme-color" content="#EAF0F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EAF0F6; --grid:rgba(44,78,130,.075); --paper:#FFFFFF; --ink:#1C2A4A; --ink2:#55627E; --line:#D3DCE8;
  --red:#C8372D; --hl:#FFE45C;
  --listen:#5A4FCF; --affix:#1F8A70; --punct:#C9711F; --sent:#2F6FD1; --vocab:#B0417A; --reflect:#C8372D;
  --ok:#1E8A55; --okbg:#E3F5EA; --no:#C23B3B; --nobg:#FBE7E5;
  --hue:var(--red);
  --ui:"Schibsted Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--page);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sent);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}

/* ---------- home ---------- */
.brand{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px}
.brand img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 6px}
.reset{background:none;border:0;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.slip{background:var(--paper);border-radius:4px;padding:22px 18px 16px;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(28,42,74,.45);position:relative;border-left:3px solid var(--red)}
.slip .raw{font-family:var(--read);font-size:17px;color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(200,55,45,.6)}
.slip .fixed{font-family:var(--read);font-size:clamp(30px,9vw,42px);font-weight:600;line-height:1.15;margin:6px 0 4px;letter-spacing:-.01em}
.slip .ins{color:var(--red);display:inline-block;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.slip .ins:nth-of-type(1){animation-delay:.35s}.slip .ins:nth-of-type(2){animation-delay:.6s}.slip .ins:nth-of-type(3){animation-delay:.85s}.slip .ins:nth-of-type(4){animation-delay:1.1s}.slip .ins:nth-of-type(5){animation-delay:1.35s}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(1.6)}to{opacity:1;transform:none}}
.slip .cap{font-size:14px;color:var(--ink2);margin:0}
h1{font-family:var(--ui);font-weight:900;font-size:clamp(56px,17vw,84px);line-height:.88;letter-spacing:-.035em;margin:26px 0 0}
.lede{color:var(--ink2);margin:12px 0 0;max-width:36ch}
.overall{margin:22px 0 4px}
.overall .bar{display:flex;gap:3px;height:12px}
.overall .bar span{flex:var(--n);background:color-mix(in srgb,var(--c) 18%,#fff);border-radius:3px;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--c)}
.overall p{font-size:14px;color:var(--ink2);margin:8px 0 0}
.sec{margin-top:30px}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.tab{width:12px;height:28px;border-radius:3px;background:var(--c);flex:none}
.sech h2{font-weight:800;font-size:25px;margin:0;line-height:1.1;letter-spacing:-.01em}
.sec>p{margin:0 0 12px 22px;color:var(--ink2);font-size:14px}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lvl{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px}
.lvl:active{transform:scale(.99)}
.lvl h3{font-weight:700;font-size:18px;margin:0;line-height:1.2}
.lvl p{margin:2px 0 0;font-size:14px;color:var(--ink2);line-height:1.35}
.lvl .mini{height:4px;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:2px;margin-top:8px;overflow:hidden}
.lvl .mini i{display:block;height:100%;background:var(--c)}
.count{font-weight:700;font-size:15px;color:var(--ink2);white-space:nowrap}
.count.done{color:var(--c)}
.mixbtn{background:var(--ink);color:#fff;border-color:var(--ink);border-left-color:var(--red)}
.mixbtn p,.mixbtn .count{color:#C9D2E3}

/* ---------- quiz ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.where{font-size:14px;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.3}
.qhead{font-weight:900;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:8px 0 12px;color:var(--hue)}
.track{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--hue);width:0;transition:width .3s}
.card{background:var(--paper);border-radius:6px;padding:20px 18px;margin-top:16px;box-shadow:0 1px 0 var(--line),0 14px 30px -22px rgba(28,42,74,.5);border-top:5px solid var(--hue)}
.ask{font-size:15px;color:var(--ink2);margin:0 0 12px;font-weight:600}
.sent{font-family:var(--read);font-size:21px;line-height:1.6;margin:0}
.gap{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--hue);line-height:1.2}
.gap.filled{color:var(--ok);border-color:var(--ok);font-weight:600;min-width:0}
.hl{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);font-weight:600;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:#F3F6FA;border:2px solid transparent;border-radius:10px;padding:11px 14px;font-size:17px;line-height:1.35}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-weight:800;font-size:14px;color:var(--ink2)}
.opt:not(:disabled):hover{border-color:var(--hue)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--nobg);border-color:var(--no)} .opt.wrong .k{background:var(--no);color:#fff}
.opt.dim{opacity:.5}
.markin,.wordin{font:inherit;font-weight:700;color:var(--ink);border:0;border-bottom:3px solid var(--hue);background:color-mix(in srgb,var(--hue) 9%,#fff);border-radius:6px 6px 0 0;text-align:center;outline:none;padding:0 4px;line-height:1.3}
.markin{width:2.4em}
.markin.right,.wordin.right,.cell input.right{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.markin.wrong,.wordin.wrong,.cell input.wrong{border-color:var(--no);color:var(--no);background:var(--nobg)}
.wrongline{display:block;background:#F3F6FA;border-left:4px solid var(--red);border-radius:6px;padding:8px 12px}
.rawline{display:block;background:#F3F6FA;border-radius:6px;padding:8px 12px;color:var(--ink2)}
.pair{display:flex;flex-direction:column;gap:6px}
.pair span{display:block;background:#F3F6FA;border-radius:6px;padding:6px 12px}
.how{display:inline-block;margin-top:10px;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--hue);background:color-mix(in srgb,var(--hue) 10%,#fff);border-radius:6px;padding:3px 10px}
.tbox{width:100%;font-family:var(--read);font-size:18px;line-height:1.45;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px;resize:vertical;min-height:88px;background:#fff}
.tbox:focus{outline:none;border-color:var(--hue)}
.tbox:disabled{background:#F3F6FA}
.cells{display:grid;gap:12px;margin-top:16px}
.cell label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.cell input{width:100%;font-family:var(--read);font-size:18px;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff}
.cell input:focus{outline:none;border-color:var(--hue)}
.afx{display:inline-block;font-family:var(--ui);font-weight:900;font-size:34px;letter-spacing:-.01em;color:var(--hue)}
.afxk{display:block;font-size:14px;color:var(--ink2);font-family:var(--ui)}
.btn{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:15px;font-weight:800;font-size:18px}
.btn.check{background:var(--hue)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.nudge{margin-top:10px;font-size:15px;color:var(--red);min-height:1px}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;font-size:16px}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--nobg)}
.fb strong{display:block;font-size:19px;font-weight:800;margin-bottom:2px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--no)}
.fb ul{margin:6px 0;padding-left:20px}
.diff{margin:8px 0 4px;font-family:var(--read);line-height:1.5}
.diff small{display:block;font-family:var(--ui);font-size:13px;color:var(--ink2)}
.diff .x{color:var(--no);text-decoration:underline wavy;text-underline-offset:3px;font-weight:600}
.diff .y{color:var(--ok);font-weight:700;background:rgba(30,138,85,.1);border-radius:3px}
.model{font-family:var(--read);display:block;margin-top:6px}
.streak{font-size:14px;color:var(--ink2);margin-top:12px;text-align:center;min-height:1.5em}

/* ---------- round end ---------- */
.end{text-align:center;padding-top:20px}
.end .big{font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-.02em;color:var(--hue);margin:16px 0 6px}
.end p{color:var(--ink2);margin:6px auto;max-width:34ch}
.stars{font-size:40px;letter-spacing:6px;margin:14px 0 0;color:#E0A21B}
.stars .off{color:var(--line)}
.missed{text-align:left;list-style:disc;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 36px;margin:18px 0 0;font-family:var(--read)}
.missed li{margin:4px 0}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:20px}

/* ---------- reflection ---------- */
.prompts{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.prompt{text-align:left;background:#F3F6FA;border:2px solid transparent;border-radius:10px;padding:10px 12px;font-family:var(--read);font-size:16px;line-height:1.4}
.prompt[aria-pressed="true"]{border-color:var(--red);background:#fff}
.step{margin-top:22px}
.step h3{display:flex;gap:10px;align-items:baseline;font-weight:800;font-size:20px;margin:0}
.step h3 b{color:var(--red);font-weight:900}
.step .tip{margin:2px 0 8px;color:var(--ink2);font-size:15px}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starter{background:#fff;border:1px dashed color-mix(in srgb,var(--red) 55%,#fff);color:var(--ink);border-radius:8px;padding:5px 9px;font-family:var(--read);font-size:15px}
.step .tbox{margin-top:8px;min-height:110px}
.wc{position:sticky;bottom:0;margin:22px -18px -20px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:0 0 6px 6px;display:flex;justify-content:space-between;gap:10px;font-size:15px;z-index:2}
.wc b{font-size:18px}
.checklist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:15px}
.checklist .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px}
.checklist li.done .box{background:var(--ok);border-color:var(--ok)}
.checklist small{display:block;color:var(--ink2)}
.panel{background:#F3F6FA;border-radius:10px;padding:14px 16px;margin-top:18px}
.panel h4{margin:0 0 4px;font-size:17px;font-weight:800}
.example p{font-family:var(--read);font-size:16px;margin:8px 0}
.example .tag{background:linear-gradient(transparent 15%,var(--hl) 15%,var(--hl) 85%,transparent 85%)}
.final{font-family:var(--read);font-size:17px;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const DATA = {"sections": [{"key": "listen", "name": "Listening Skills", "sub": "Figurative language and parts of speech, practiced in writing", "levels": [{"key": "fig", "name": "Figurative Language", "sub": "Simile, metaphor, personification, hyperbole…", "qs": [{"k": "mc", "t": "Her smile was as bright as the sun.", "o": ["simile", "metaphor", "hyperbole", "personification"], "n": "Simile: compares two things using “as … as” or “like.”", "id": "fig1", "w": "Her smile was as bright as the sun.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The classroom was a zoo after the bell rang.", "o": ["metaphor", "simile", "idiom", "personification"], "n": "Metaphor: says one thing IS another (the classroom = a zoo), without “like” or “as.”", "id": "fig2", "w": "The classroom was a zoo after the bell rang.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The wind whispered through the trees.", "o": ["personification", "onomatopoeia", "metaphor", "alliteration"], "n": "Personification: gives a human action (whispering) to something that is not human (the wind).", "id": "fig3", "w": "The wind whispered through the trees.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "I have told you a million times to clean your room!", "o": ["hyperbole", "idiom", "metaphor", "simile"], "n": "Hyperbole: a huge exaggeration (not really a million times) for effect.", "id": "fig4", "w": "I have told you a million times to clean your room!", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "Sally sells seashells by the seashore.", "o": ["alliteration", "onomatopoeia", "hyperbole", "personification"], "n": "Alliteration: the same first sound repeated in words close together (s, s, s).", "id": "fig5", "w": "Sally sells seashells by the seashore.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "Buzz! The alarm clock woke the whole house.", "o": ["onomatopoeia", "alliteration", "personification", "hyperbole"], "n": "Onomatopoeia: a word that sounds like the noise it describes (buzz).", "id": "fig6", "w": "Buzz! The alarm clock woke the whole house.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "Don't worry about the quiz; it will be a piece of cake.", "o": ["idiom", "metaphor", "simile", "hyperbole"], "n": "Idiom: a fixed phrase with a meaning you can't guess from the words. A piece of cake = very easy.", "id": "fig7", "w": "Don't worry about the quiz; it will be a piece of cake.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "He runs like the wind.", "o": ["simile", "metaphor", "personification", "onomatopoeia"], "n": "Simile: compares using “like.”", "id": "fig8", "w": "He runs like the wind.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "My backpack weighs a ton.", "o": ["hyperbole", "metaphor", "simile", "alliteration"], "n": "Hyperbole: a big exaggeration. The backpack is heavy, not 1,000 kilograms.", "id": "fig9", "w": "My backpack weighs a ton.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "Life is a rollercoaster.", "o": ["metaphor", "simile", "idiom", "personification"], "n": "Metaphor: life IS a rollercoaster (it has ups and downs). No “like” or “as.”", "id": "fig10", "w": "Life is a rollercoaster.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The old car coughed and groaned up the hill.", "o": ["personification", "onomatopoeia", "metaphor", "hyperbole"], "n": "Personification: coughing and groaning are human actions given to a car.", "id": "fig11", "w": "The old car coughed and groaned up the hill.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The bacon sizzled in the pan.", "o": ["onomatopoeia", "personification", "alliteration", "simile"], "n": "Onomatopoeia: “sizzled” sounds like the noise of frying.", "id": "fig12", "w": "The bacon sizzled in the pan.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "It's raining cats and dogs.", "o": ["idiom", "hyperbole", "metaphor", "personification"], "n": "Idiom: raining cats and dogs = raining very heavily.", "id": "fig13", "w": "It's raining cats and dogs.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The baby was as quiet as a mouse.", "o": ["simile", "metaphor", "idiom", "alliteration"], "n": "Simile: compares using “as … as.”", "id": "fig14", "w": "The baby was as quiet as a mouse.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The stars danced in the night sky.", "o": ["personification", "metaphor", "simile", "onomatopoeia"], "n": "Personification: stars can't dance; dancing is a human action.", "id": "fig15", "w": "The stars danced in the night sky.", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "Good luck tonight. Break a leg!", "o": ["idiom", "hyperbole", "metaphor", "onomatopoeia"], "n": "Idiom: break a leg = good luck (said before a performance).", "id": "fig16", "w": "Good luck tonight. Break a leg!", "ask": "What kind of figurative language is this?"}, {"k": "mc", "t": "The snake hissed at the hikers.", "o": ["onomatopoeia", "personification", "alliteration", "simile"], "n": "Onomatopoeia: “hissed” sounds like the noise a snake makes.", "id": "fig17", "w": "The snake hissed at the hikers.", "ask": "What kind of figurative language is this?"}]}, {"key": "pos", "name": "Parts of Speech", "sub": "Noun, verb, adjective, adverb…", "qs": [{"k": "mc", "t": "The glass vase is **fragile**.", "o": ["adjective", "adverb", "noun", "verb"], "n": "Adjective: describes a noun (the vase).", "id": "pos18", "w": "The glass vase is fragile.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "Scientists collected **evidence** from the lake.", "o": ["noun", "verb", "adjective", "adverb"], "n": "Noun: a thing. Tip: the suffix -ence often makes a noun.", "id": "pos19", "w": "Scientists collected evidence from the lake.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "Please **submerge** the vegetables in cold water.", "o": ["verb", "noun", "adjective", "preposition"], "n": "Verb: an action (to put under water).", "id": "pos20", "w": "Please submerge the vegetables in cold water.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "She **carefully** measured the liquid.", "o": ["adverb", "adjective", "verb", "noun"], "n": "Adverb: describes a verb (how she measured). Many adverbs end in -ly.", "id": "pos21", "w": "She carefully measured the liquid.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "The cat slept **under** the table.", "o": ["preposition", "adverb", "conjunction", "pronoun"], "n": "Preposition: shows position (where the cat slept).", "id": "pos22", "w": "The cat slept under the table.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "I wanted to go, **but** it was raining.", "o": ["conjunction", "preposition", "adverb", "pronoun"], "n": "Conjunction: joins two clauses. But is a FANBOYS word.", "id": "pos23", "w": "I wanted to go, but it was raining.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "**Wow**, that view is scenic!", "o": ["interjection", "adjective", "adverb", "noun"], "n": "Interjection: a word that shows strong feeling, often followed by ! or a comma.", "id": "pos24", "w": "Wow, that view is scenic!", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "Elif lost her keys, so **she** asked for help.", "o": ["pronoun", "noun", "conjunction", "preposition"], "n": "Pronoun: replaces a noun (she = Elif).", "id": "pos25", "w": "Elif lost her keys, so she asked for help.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "My grandfather is a very **thoughtful** man.", "o": ["adjective", "adverb", "noun", "verb"], "n": "Adjective: describes a noun (the man).", "id": "pos26", "w": "My grandfather is a very thoughtful man.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "The scientists **observed** the stars all night.", "o": ["verb", "noun", "adjective", "adverb"], "n": "Verb: an action in the past (observe → observed).", "id": "pos27", "w": "The scientists observed the stars all night.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "Our **observation** lasted two hours.", "o": ["noun", "verb", "adverb", "adjective"], "n": "Noun: the suffix -tion makes a noun (observe → observation).", "id": "pos28", "w": "Our observation lasted two hours.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "The room was **incredibly** tranquil.", "o": ["adverb", "adjective", "verb", "preposition"], "n": "Adverb: describes an adjective (how tranquil? incredibly).", "id": "pos29", "w": "The room was incredibly tranquil.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "We walked **through** the quaint village.", "o": ["preposition", "conjunction", "adverb", "pronoun"], "n": "Preposition: shows movement or position (through the village).", "id": "pos30", "w": "We walked through the quaint village.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "**Although** the task was tedious, we finished it.", "o": ["conjunction", "preposition", "adverb", "interjection"], "n": "Conjunction: although starts a dependent clause (a subordinating conjunction).", "id": "pos31", "w": "Although the task was tedious, we finished it.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "**They** live in a luxurious apartment.", "o": ["pronoun", "noun", "adjective", "conjunction"], "n": "Pronoun: replaces people's names.", "id": "pos32", "w": "They live in a luxurious apartment.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "**Oops**! I dropped the plate.", "o": ["interjection", "verb", "noun", "adverb"], "n": "Interjection: a short word that shows feeling.", "id": "pos33", "w": "Oops! I dropped the plate.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "The **decade** passed quickly.", "o": ["noun", "adjective", "verb", "adverb"], "n": "Noun: a thing (a period of ten years).", "id": "pos34", "w": "The decade passed quickly.", "ask": "What part of speech is the highlighted word?"}, {"k": "mc", "t": "Water is **scarce** in the desert.", "o": ["adjective", "adverb", "noun", "verb"], "n": "Adjective: describes the noun water. It comes after the verb is.", "id": "pos35", "w": "Water is scarce in the desert.", "ask": "What part of speech is the highlighted word?"}]}]}, {"key": "affix", "name": "Affix Table", "sub": "Key Words 1, 2 and 3", "levels": [{"key": "table", "name": "Fill the Affix Table", "sub": "Meaning, origin and an example for every affix", "qs": [{"k": "row", "af": "-ence / -ance", "kind": "suffix", "mean": "an action, state or quality", "keys": "action|state|quality", "origin": "Latin", "ex": "^[a-z]{3,}(ence|ance)$", "cls": ["evidence", "inference", "diligence"], "n": "", "id": "table36", "w": "-ence / -ance", "ask": "Fill in the row of the affix table."}, {"k": "row", "af": "-tion", "kind": "suffix", "mean": "an action or a state", "keys": "action|state", "origin": "Latin", "ex": "^[a-z]{3,}tion$", "cls": ["observation", "precaution", "contamination", "inhalation", "instruction"], "n": "", "id": "table37", "w": "-tion", "ask": "Fill in the row of the affix table."}, {"k": "row", "af": "-able / -ible / -ble", "kind": "suffix", "mean": "capable of, fit for", "keys": "capable|able|fit|can be", "origin": "Latin", "ex": "^[a-z]{3,}(able|ible|ble)$", "cls": ["variable", "falsifiable", "flammable"], "n": "", "id": "table38", "w": "-able / -ible / -ble", "ask": "Fill in the row of the affix table."}, {"k": "row", "af": "-ed", "kind": "suffix", "mean": "having the characteristics of", "keys": "having|characte ing."}, {"k": "find", "word": "decade", "which": "base word", "a": ["dec", "deca"], "keys": "\\bten\\b|\\b10\\b", "mean": "ten", "af": "dec / deca", "n": "decade: base word dec, meaning “ten”.", "id": "find66", "w": "decade", "ask": "Type the affix, then its meaning."}, {"k": "find", "word": "fragment", "which": "base word", "a": ["frag"], "keys": "break|broke|broken", "mean": "break", "af": "fract / frag", "n": "fragment: base word frag, meaning “break”.", "id": "find67", "w": "fragment", "ask": "Type the affix, then its meaning."}, {"k": "find", "word": "fraction", "which": "base word", "a": ["fract"], "keys": "break|broke|broken", "mean": "break", "af": "fract / frag", "n": "fraction: base word fract, meaning “break”.", "id": "find68", "w": "fraction", "ask": "Type the affix, then its meaning."}, {"k": "find", "word": "multicolored", "which": "base word", "a": ["multi"], "keys": "many|more than one|several|lots", "mean": "many, more than one", "af": "multi", "n": "multicolored: base word multi, meaning “many, more than one”.", "id": "find69", "w": "multicolored", "ask": "Type the affix, then its meaning."}]}, {"key": "kw1", "name": "Key Words 1: Suffixes", "sub": "-ence, -tion, -able, -ed, -ment", "qs": [{"k": "mc", "t": "The police found new _____ that proved the man was innocent.", "o": ["evidence", "equipment", "instruction", "admiration"], "n": "evidence = something that shows that something is true (-ence)", "id": "kw170", "w": "evidence", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The text doesn't say Mia is sad, but we can make an _____ from her tears.", "o": ["inference", "observation", "instruction", "admiration"], "n": "inference = the act of reaching a conclusion (-ence)", "id": "kw171", "w": "inference", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "After weeks of careful _____, the scientist noticed that the birds always flew south at night.", "o": ["observation", "inhalation", "contamination", "declaration"], "n": "observation = the act of careful watching (-tion)", "id": "kw172", "w": "observation", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "As a _____, always wear goggles in the science lab.", "o": ["precaution", "predicament", "measurement", "declaration"], "n": "precaution = an action to stop trouble or harm from happening (-tion)", "id": "kw173", "w": "precaution", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The factory waste caused serious _____ of the river water.", "o": ["contamination", "observation", "admiration", "diligence"], "n": "contamination = making something dirty or harmful (-tion)", "id": "kw174", "w": "contamination", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The firefighter was treated for smoke _____ after the fire.", "o": ["inhalation", "instruction", "equipment", "evidence"], "n": "inhalation = breathing in (-tion)", "id": "kw175", "w": "inhalation", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Read each _____ carefully before you start the experiment.", "o": ["instruction", "inference", "contamination", "declaration"], "n": "instruction = a statement that tells you how to do something (-tion)", "id": "kw176", "w": "instruction", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "In this experiment, temperature is the only _____ that we change.", "o": ["variable", "equipment", "evidence", "precaution"], "n": "variable = something that can change (-able)", "id": "kw177", "w": "variable", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Keep the paint away from the stove; it is highly _____.", "o": ["flammable", "adaptable", "gullible", "indisputable"], "n": "flammable = can easily catch fire (-able)", "id": "kw178", "w": "flammable", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The photo had been _____ on a computer to make the sky look bluer.", "o": ["manipulated", "excavated" und", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "Although she was tired, she finished her homework.", "a": ["complex"], "n": "Dependent clause (Although …) + independent clause.", "id": "types164", "w": "Although she was tired, she finished her homework. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "My cousin and I watched a movie last night.", "a": ["simple"], "n": "Two subjects but only ONE clause (one verb: watched). Still simple.", "id": "types165", "w": "My cousin and I watched a movie last night. → simple", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "We can take the bus, or we can walk.", "a": ["compound"], "n": "Two independent clauses joined by , or (FANBOYS).", "id": "types166", "w": "We can take the bus, or we can walk. → compound", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "I went to bed early because I had an exam.", "a": ["complex"], "n": "because starts a dependent clause → complex.", "id": "types167", "w": "I went to bed early because I had an exam. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "The students laughed and clapped at the end of the show.", "a": ["simple"], "n": "One subject with two verbs, but only one clause → simple.", "id": "types168", "w": "The students laughed and clapped at the end of the show. → simple", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "When the bell rang, everyone ran outside.", "a": ["complex"], "n": "When … = dependent clause → complex.", "id": "types169", "w": "When the bell rang, everyone ran outside. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "Selin likes math, so she joined the robotics club.", "a": ["compound"], "n": "Two independent clauses joined by , so (FANBOYS).", "id": "types170", "w": "Selin likes math, so she joined the robotics club. → compound", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "He didn't study, yet he passed the test.", "a": ["compound"], "n": "Two independent clauses joined by , yet (FANBOYS).", "id": "types171", "w": "He didn't study, yet he passed the test. → compound", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "If you finish early, you can read a book.", "a": ["complex"], "n": "If … = dependent clause → complex.", "id": "types172", "w": "If you finish early, you can read a book. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "The fragile old vase sat on the shelf.", "a": ["simple"], "n": "One clause → simple, even with many adjectives.", "id": "types173", "w": "The fragile old vase sat on the shelf. → simple", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "Since it was a holiday, the shops were closed.", "a": ["complex"], "n": "Since … = dependent clause → complex.", "id": "types174", "w": "Since it was a holiday, the shops were closed. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "My brother plays the guitar, and my sister sings.", "a": ["compound"], "n": "Two independent clauses joined by , and.", "id": "types175", "w": "My brother plays the guitar, and my sister sings. → compound", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "We stayed at home after the storm.", "a": ["simple"], "n": "after the storm has no verb, so it is not a clause. One clause → simple.", "id": "types176", "w": "We stayed at home after the storm. → simple", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "We stayed at home after the storm started.", "a": ["complex"], "n": "after the storm started has a subject and a verb → dependent clause → complex.", "id": "types177", "w": "We stayed at home after the storm started. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "Before you leave, turn off the lights.", "a": ["complex"], "n": "Before … = dependent clause → complex.", "id": "types178", "w": "Before you leave, turn off the lights. → complex", "ask": "Type simple, compound or complex."}, {"k": "type", "t": "Emre was hungry, so he made a sandwich.", "a": ["compound"], "n": "Two independent clauses joined by , so.", "id": "types179", "w": "Emre was hungry, so he made a sandwich. → compound", "ask": "Type simple, compound or complex."}]}, {"key": "joins", "name": "Join Them", "sub": "FANBOYS and AAAWWUBBIS with the right commas", "qs": [{"k": "join", "s1": "It was cold.", "s2": "We went to the beach.", "how": "Join with but.", "a": ["It was cold, but we went to the beach."], "n": "FANBOYS joining two clauses: comma BEFORE but.", "id": "joins180", "w": "It was cold, but we went to the beach.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "Emre was hungry.", "s2": "He made a sandwich.", "how": "Join with so.", "a": ["Emre was hungry, so he made a sandwich."], "n": "Comma before so.", "id": "joins181", "w": "Emre was hungry, so he made a sandwich.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "You can call me.", "s2": "You can send a message.", "how": "Join with or.", "a": ["You can call me, or you can send a message."], "n": "Comma before or when it joins two clauses.", "id": "joins182", "w": "You can call me, or you can send a message.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "Defne loves art.", "s2": "Her brother loves science.", "how": "Join with and.", "a": ["Defne loves art, and her brother loves science."], "n": "Comma before and when it joins two clauses.", "id": "joins183", "w": "Defne loves art, and her brother loves science.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "I went to bed.", "s2": "I was tired.", "how": "Join with because in the middle.", "a": ["I went to bed because I was tired."], "n": "Dependent clause at the end → no comma.", "id": "joins184", "w": "I went to bed because I was tired.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "It rained.", "s2": "We stayed inside.", "how": "Start with When.", "a": ["When it rained, we stayed inside."], "n": "Dependent clause first → comma after it.", "id": "joins185", "w": "When it rained, we stayed inside.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "She was nervous.", "s2": "She gave a great speech.", "how": "Start with Although.", "a": ["Although she was nervous, she gave a great speech."], "n": "Dependent clause first → comma after it.", "id": "joins186", "w": "Although she was nervous, she gave a great speech.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "You study every day.", "s2": "You will pass the exam.", "how": "Start with If.", "a": ["If you study every day, you will pass the exam."], "n": "Dependent clause first → comma after it.", "id": "joins187", "w": "If you study every day, you will pass the exam.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "We ate dinner.", "s2": "We finished our homework.", "how": "Join with after in the middle.", "a": ["We ate dinner after we finished our homework."], "n": "Dependent clause at the end → no comma.", "id": "joins188", "w": "We ate dinner after we finished our homework.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "The shop was closed.", "s2": "We went home.", "how": "Start with Since.", "a": ["Since the shop was closed, we went home."], "n": "Dependent clause first → comma after it.", "id": "joins189", "w": "Since the shop was closed, we went home.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "The test was difficult.", "s2": "Everyone passed.", "how": "Join with yet.", "a": ["The test was difficult, yet everyone passed."], "n": "Comma before yet.", "id": "joins190", "w": "The test was difficult, yet everyone passed.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}, {"k": "join", "s1": "My mom cooked dinner.", "s2": "My dad set the table.", "how": "Join with while in the middle.", "a": ["My mom cooked dinner while my dad set the table."], "n": "Dependent clause at the end → no comma.", "id": "joins191", "w": "My mom cooked dinner while my dad set the table.", "ask": "Join the two sentences. Follow the instruction and punctuate correctly."}]}, {"key": "changes", "name": "Change It", "sub": "Turn simple sentences into compound or complex ones", "qs": [{"k": "change", "t": "I love chocolate.", "target": "compound", "m": "I love chocolate, but I hate chocolate with nuts.", "n": "Compound = simple sentence + comma + FANBOYS + another independent clause.", "id": "changes192", "w": "I love chocolate. → compound", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "My dog is very friendly.", "target": "compound", "m": "My dog is very friendly, so everyone in the park loves him.", "n": "Compound = add , and / , but / , so … + a new clause with its own subject and verb.", "id": "changes193", "w": "My dog is very friendly. → compound", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "We went to the museum on Saturday.", "target": "compound", "m": "We went to the museum on Saturday, and we saw an immense dinosaur skeleton.", "n": "Compound: comma + FANBOYS + a full clause.", "id": "changes194", "w": "We went to the museum on Saturday. → compound", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "Ali plays the piano.", "target": "compound", "m": "Ali plays the piano, and his sister plays the violin.", "n": "Compound: comma + FANBOYS + a full clause.", "id": "changes195", "w": "Ali plays the piano. → compound", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "The weather was terrible.", "target": "compound", "m": "The weather was terrible, yet we still went hiking.", "n": "Compound: comma + FANBOYS + a full clause.", "id": "changes196", "w": "The weather was terrible. → compound", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "I always listen to music.", "target": "complex", "m": "I always listen to music when I am working.", "n": "Complex = add a dependent clause with a subordinating conjunction (when, because, although, if…).", "id": "changes197", "w": "I always listen to music. → complex", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "My sister cried.", "target": "complex", "m": "My sister cried because she lost her favorite toy.", "n": "Complex: dependent clause at the end → no comma.", "id": "changes198", "w": "My sister cried. → complex", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "We left the party early.", "target": "complex", "m": "Although the music was great, we left the party early.", "n": "Complex: dependent clause first → comma after it.", "id": "changes199", "w": "We left the party early. → complex", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "The lights went out.", "target": "complex", "m": "When the storm started, the lights went out.", "n": "Complex: dependent clause first → comma after it.", "id": "changes200", "w": "The lights went out. → complex", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}, {"k": "change", "t": "You should drink water.", "target": "complex", "m": "You should drink water if you feel tired.", "n": "Complex: dependent clause at the end → no comma.", "id": "changes201", "w": "You should drink water. → complex", "ask": "Add to the sentence to make it compound or complex. Keep the original words."}]}]}, {"key": "vocab", "name": "Vocabulary", "sub": "Adjectives for describing people and things", "levels": [{"key": "people", "name": "Describing People", "sub": "14 adjectives, each in two sentences", "qs": [{"k": "mc", "t": "Even in an emergency, Dad stays calm and _____; he thinks carefully before he acts.", "o": ["rational", "chatty", "insecure", "magnetic"], "n": "rational = thinks clearly and logically", "id": "people202", "w": "rational", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "There must be a _____ explanation for the strange noise; it's probably just the wind.", "o": ["rational", "chatty", "frustrating", "courageous"], "n": "rational = based on clear thinking", "id": "people203", "w": "rational", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The _____ girl turned an old cardboard box into a spaceship.", "o": ["imaginative", "rational", "insecure", "self-centered"], "n": "imaginative = full of new and creative ideas", "id": "people204", "w": "imaginative", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Our teacher wants stories that are _____ and full of new ideas, not copies of films.", "o": ["imaginative", "conscientious", "self-centered", "frustrating"], "n": "imaginative = creative", "id": "people205", "w": "imaginative", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Ela is very _____; she loves parties and makes friends everywhere she goes.", "o": ["outgoing", "insecure", "conscientious", "rational"], "n": "outgoing = friendly and loves meeting people", "id": "people206", "w": "outgoing", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "My shy cousin became more _____ after she joined the drama club.", "o": ["outgoing", "frustrating", "idealistic", "self-centered"], "n": "outgoing = sociable, not shy", "id": "people207", "w": "outgoing", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Kerem is a very _____ student who always checks his work and never misses a deadline.", "o": ["conscientious", "chatty", "frustrating", "magnetic"], "n": "conscientious = careful and hard-working, wants to do things right", "id": "people208", "w": "conscientious", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "A _____ doctor double-checks every prescription before giving it to a patient.", "o": ["conscientious", "chatty", "self-centered", "frustrating"], "n": "conscientious = careful to do the job well", "id": "people209", "w": "conscientious", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "It was very _____ of you to bring me soup when I was ill.", "o": ["thoughtful", "insecure", "chatty", "unconventional"], "n": "thoughtful = kind; thinks about other people's needs", "id": "people210", "w": "thoughtful", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Ali is a _____ friend; he always remembers my birthday.", "o": ["thoughtful", "frustrating", "self-centered", "magnetic"], "n": "thoughtful = considerate", "id": "people211", "w": "thoughtful", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "She feels _____ about her English, so she rarely speaks in class.", "o": ["insecure", "outgoing", "courageous", "rational"], "n": "insecure = not confident", "id": "people212", "w": "insecure", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Many teenagers feel _____ about how they look.", "o": ["insecure", "genuine", "conscientious", "magnetic"], "n": "insecure = worried, not confident", "id": "people213", "w": "insecure", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "The artist is famous for her _____ style; she paints with coffee instead of paint.", "o": ["unconventional", "conscientious", "insecure", "rational"], "n": "unconventional = different from what most people do", "id": "people214", "w": "unconventional", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "My uncle has a very _____ job: he tests water slides.", "o": ["unconventional", "thoughtful", "chatty", "genuine"], "n": "unconventional = unusual", "id": "people215", "w": "unconventional", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "It's so _____ when the internet stops working in the middle of a game.", "o": ["frustrating", "genuine", "thoughtful", "courageous"], "n": "frustrating = making you feel annoyed", "id": "people216", "w": "frustrating", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "My little brother can be _____: he never listens and always touches my things.", "o": ["frustrating", "conscientious", "idealistic", "magnetic"], "n": "frustrating = annoying", "id": "people217", "w": "frustrating", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "She is so _____ that she believes she can end world hunger by herself.", "o": ["idealistic", "rational", "chatty", "insecure"], "n": "idealistic = believes in perfect ideas, even when they are not realistic", "id": "people218", "w": "idealistic", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Young people are often _____ and want to make the world a perfect place.", "o": ["idealistic", "frustrating", "self-centered", "chatty"], "n": "idealistic = dreams of a perfect world", "id": "people219", "w": "idealistic", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Our _____ neighbor talks to everyone for hours.", "o": ["chatty", "rational", "conscientious", "courageous"], "n": "chatty = loves talking", "id": "people220", "w": "chatty", "ask": "Choose the word that fits the sentence."}, {"k": "mc", "t": "Defne was so _____ in class that the teacher moved her to another seat.", "o": ["chatty function strict(s){
  return String(s).replace(/[“”„‟″]/g,'"').replace(/[‘’‚‛`´′]/g,"'").replace(/…/g,"...")
    .replace(/\s+/g," ").replace(/\s+([,.;:!?])/g,"$1").trim();
}

function wordDiff(mine,right){
  const A=strict(mine).split(" "), B=strict(right).split(" ");
  const n=A.length,m=B.length,T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=A[i]===B[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const inA=new Set(),inB=new Set();let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){inA.add(i);inB.add(j);i++;j++;}else if(T[i+1][j]>=T[i][j+1])i++;else j++;}
  return {mine:A.map((w,x)=>inA.has(x)?esc(w):`<span class="x">${esc(w)}</span>`).join(" "),
          right:B.map((w,x)=>inB.has(x)?esc(w):`<span class="y">${esc(w)}</span>`).join(" ")};
}
const FAN=["for","and","nor","but","or","yet","so"];
const SUB=["even though","even if","as soon as","although","though","because","before","after","since","unless","until","whenever","wherever","when","where","while","whereas","if","once","as"];
const FANRE=new RegExp("\\b("+FAN.join("|")+")\\b","i");
const SUBRE=new RegExp("\\b("+SUB.join("|")+")\\b","i");
function checkChange(q,v){
  const t=v.trim(), errs=[];
  const words=s=>s.toLowerCase().replace(/[^a-z'\s]/g," ").split(/\s+/).filter(Boolean);
  const base=words(q.t), all=words(t);
  const hay=" "+all.join(" ")+" ", needle=" "+base.join(" ")+" ";
  const at=hay.indexOf(needle);
  if(at<0) errs.push("Keep all the words of the original sentence, in the same order.");
  if(!/^[A-Z]/.test(t)) errs.push("Start with a capital letter.");
  if(!/[.!]$/.test(t)) errs.push("End the sentence with a period.");
  // text without the original clause, to find the joining word
  const lower=" "+t.toLowerCase().replace(/[^a-z',\s]/g," ").replace(/\s+/g," ")+" ";
  const baseTxt=" "+q.t.toLowerCase().replace(/[^a-z'\s]/g," ").replace(/\s+/g," ").trim();
  const extra=lower.replace(baseTxt," ").trim();
  if(all.length<base.length+3) errs.push("Add a new clause with its own subject and verb (at least three more words).");
  if(q.target==="compound"){
    if(!FANRE.test(extra)){
      errs.push(SUBRE.test(extra)?"That joining word makes a complex sentence. For a compound sentence, use a FANBOYS word: for, and, nor, but, or, yet, so.":"Join a new clause with a FANBOYS word: for, and, nor, but, or, yet, so.");
    } else if(!/,\s*(for|and|nor|but|or|yet|so)\s+\S+\s+\S+/i.test(t)){
      errs.push("Put a comma BEFORE the FANBOYS word, and write a full clause after it.");
    }
  } else {
    const m=extra.match(SUBRE);
    if(!m){
      errs.push(FANRE.test(extra)?"A FANBOYS word makes a compound sentence. For a complex sentence, use a word like because, when, although, if, since, before, after.":"Add a dependent clause that starts with a word like because, when, although, if, since, before, after.");
    } else {
      const w=m[1].toLowerCase();
      const startsWithSub=new RegExp("^"+w.replace(" ","\\s+")+"\\b","i").test(t);
      if(startsWithSub){ if(!/,/.test(t)) errs.push("The dependent clause comes first, so put a comma after it."); }
      else if(new RegExp(",\\s*"+w.replace(" ","\\s+")+"\\b","i").test(t)) errs.push("The dependent clause comes at the end, so don't put a comma before “"+w+"”.");
      const after=t.toLowerCase().split(new RegExp("\\b"+w.replace(" ","\\s+")+"\\b"))[1]||"";
      if(after.trim().split(/\s+/).filter(Boolean).length<2) errs.push("Write a full clause after “"+w+"” (a subject and a verb).");
    }
  }
  return errs;
}

  pos=shuffle(pos.slice(0,mc.length)); let p=0;
  S.queue=S.queue.map(q=>{
    if(q.k!=="mc") return Object.assign({},q);

      work.innerHTML=`<textarea class="tbox" id="ans" rows="2" ${ATTR} autocapitalize="sentences" placeholder="Write one sentence here" aria-label="Your sentence"></textarea>`;
    } else if(q.k==="change"){
      $("sent").innerHTML=`<span class="rawline">${esc(q.t)}</span><span class="how">Make it ${esc(q.target)}</span>`;
      work.innerHTML=`<textarea class="tbox" id="ans" rows="3" ${ATTR} autocapitalize="sentences" placeholder="Write your ${esc(q.target)} sentence here" aria-label="Your sentence"></textarea>`;
    } else if(q.k==="row"){
      $("sent").innerHTML=`<span class="afx">${esc(q.af)}</span><span class="afxk">${esc(q.kind)}</span>`;
      work.innerHTML=`<div class="cells">
        <div class="cell"><label for="c_mean">Meaning</label><input id="c_mean" ${ATTR} autocapitalize="off"></div>
        ${q.origin?`<div class="cell"><label for="c_orig">Origin</label><input id="c_orig" ${ATTR} autocapitalize="off" placeholder="Latin or Greek"></div>`:""}
        <div class="cell"><label for="c_ex">Example word</label><input id="c_ex" ${ATTR} autocapitalize="off"></div></div>`;
    } else if(q.k==="find"){
      $("sent").innerHTML=`<span class="afx">${esc(q.word)}</span><span class="afxk">Find the ${esc(q.which)}</span>`;
      work.innerHTML=`<div class="cells">
        <div class="cell"><label for="c_af">The ${esc(q.which)}</label><input id="c_af" ${ATTR} autocapitalize="off"></div>
        <div class="cell"><label for="c_mean">Its meaning</label><input id="c_mean" ${ATTR} autocapitalize="off"></div></div>`;
    }
    work.insertAdjacentHTML("beforeend",checkButton());
    $("checkBtn").onclick=checkTyped;
    work.parentNode.querySelectorAll("input,textarea").forEach(el=>el.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault(); if(!S.locked){ const ins=[...document.querySelectorAll("#quiz input:not([disabled])")]; const ix=ins.indexOf(e.target); if(e.target.tagName==="INPUT"&&ix>-1&&ix<ins.length-1&&!ins[ix+1].value){ins[ix+1].focus();} else checkTyped(); } else $("nextBtn").click(); }
    }));
    focusEl=document.querySelector("#quiz input, #quiz textarea");
  }
  window.scrollTo(0,0);
  if(focusEl) setTimeout(()=>{const ae=document.activeElement; if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")) return; try{focusEl.focus({preventScroll:true})}catch(e){}},30);
}
function finish(q,ok,html){
  const fb=$("fb"); fb.hidden=false;
  if(ok){
    mastered[q.id]=true; store.set("mastered",mastered);
    if(S.round===1) S.firstRight++;
    S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak);
    fb.className="fb ok"; fb.innerHTML=`<strong>Correct!</strong>${html||""}${esc(q.n)}`;
  } else {
    S.miss.push(q); S.streak=0;
    fb.className="fb no"; fb.innerHTML=`${html}${esc(q.n)}<br>This one will come back in the next round.`;
  }
  $("streak").textContent=S.streak>=3?`${S.streak} in a row!`:"";
  const nb=$("nextBtn"); nb.hidden=false; nb.textContent=S.i+1<S.queue.length?"Next question":"See my results";
  nb.focus({preventScroll:true});
}
function answerMC(j){
  const q=S.queue[S.i]; if(S.locked) return; S.locked=true;
  [...document.querySelectorAll("#work .opt")].forEach((b,k)=>{b.disabled=true; if(k===q.ans)b.classList.add("right"); else if(k===j)b.classList.add("wrong"); else b.classList.add("dim");});
  if(q.t.includes("_____")) $("sent").innerHTML=mcSentence(q,true);
  const ok=j===q.ans;
  finish(q,ok,ok?"":`<strong>Not quite. The answer is “${esc(q.opts[q.ans])}”.</strong>`);
}
function nudge(msg,el){ $("nudge").textContent=msg; if(el) el.focus(); }
function checkTyped(){
  const q=S.queue[S.i]; if(S.locked) return;
  const lock=()=>{S.locked=true; $("nudge").textContent=""; document.querySelectorAll("#quiz input, #quiz textarea").forEach(e=>e.disabled=true); $("checkBtn").hidden=true;};
  if(q.k==="row"||q.k==="find"){
    const cells=[...document.querySelectorAll("#work .cell input")];
    const empty=cells.find(c=>!c.value.trim()); if(empty) return nudge("Fill in every box first.",empty);
    const res=[];
    if(q.k==="row"){
      res.push([$("c_mean"), new RegExp(q.keys,"i").test($("c_mean").value)]);
      if(q.origin) res.push([$("c_orig"), letters($("c_orig").value)===q.origin.toLowerCase()]);
      const ex=letters($("c_ex").value);
      const parts=q.af.split("/").map(letters);
      res.push([$("c_ex"), new RegExp(q.ex).test(ex) && ex.length>=5 && !parts.includes(ex)]);
    } else {
      const af=letters($("c_af").value);
      res.push([$("c_af"), q.a.includes(af)]);
      res.push([$("c_mean"), new RegExp(q.keys,"i").test($("c_mean").value)]);
    }
    lock();
    res.forEach(([el,ok])=>el.classList.add(ok?"right":"wrong"));
    const ok=res.every(r=>r[1]);
    let html="";
    if(!ok){
      if(q.k==="row") html=`<strong>Not quite. Check the red boxes.</strong>`;
      else html=`<strong>Not quite.</strong><div class="diff"><small>Answer</small>${esc(q.which)}: ${esc(q.a[0])} · meaning: ${esc(q.mean)}</div>`;
    }
    if(q.k==="row") html+=`<div class="diff"><small>Class answer</small>Meaning: ${esc(q.mean)}${q.origin?` · Origin: ${esc(q.origin)}`:""}<br>Examples: ${esc(q.cls.join(", "))}</div>`;
    return finish(q,ok,html);
  }
  const inp=$("ans"), v=inp.value.trim();
  if(!v) return nudge(q.k==="mark"?"Type the missing mark first.":"Write your answer first.",inp);
  if(q.k==="rewrite"&&q.fix&&strict(v)===strict(q.t)) return nudge("You haven't changed anything yet. Find the mistake, then rewrite the sentence.",inp);
  if(q.k==="rewrite"&&!q.fix&&strict(v)===strict(q.t)) return nudge("Add capital letters and punctuation first.",inp);
  if(q.k==="change"&&loose(v)===loose(q.t)) return nudge("Add a new clause to the sentence first.",inp);
  if(q.k==="mark"){
    const ok=q.a.some(x=>strict(x)===strict(v)); lock(); inp.classList.add(ok?"right":"wrong");
    return finish(q,ok,ok?"":`<strong>Not quite. The missing mark is ${esc(q.a[0])}</strong><div class="diff">${esc(q.t.replace("_",q.a[0]))}</div>`);
  }
  if(q.k==="type"){
    const ok=loose(v)===q.a[0]; lock(); inp.classList.add(ok?"right":"wrong");
    return finish(q,ok,ok?"":`<strong>Not quite. It is ${esc(q.a[0])}.</strong>`);
  }
  if(q.k==="change"){
    const errs=checkChange(q,v); lock();
    if(!errs.length) return finish(q,true,`<div class="diff"><small>Another way to do it</small><span class="model">${esc(q.m)}</span></div>`);
    return finish(q,false,`<strong>Not quite.</strong><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul><div class="diff"><small>Example answer</small><span class="model">${esc(q.m)}</span></div>`);
  }
  // rewrite + join: strict match
  const ok=q.a.some(x=>strict(x)===strict(v)); lock();
  if(ok) return finish(q,true,"");
  const best=q.a.slice().sort((a,b)=>Math.abs(a.length-v.length)-Math.abs(b.length-v.length))[0];
  const d=wordDiff(v,best);
  finish(q,false,`<strong>Not quite.</strong><div class="diff"><small>You wrote</small>${d.mine}</div><div class="diff"><small>Correct sentence</small>${d.right}</div>`);
}
$("nextBtn").onclick=()=>{ S.locked=false; S.i++; if(S.i<S.queue.length) showQ(); else endRound(); };
function endRound(){
  $("trackFill").style.width="100%";
  const box=$("endBox");
  if(S.miss.length){
    const items=[...new Set(S.miss.map(q=>q.w))];
    box.innerHTML=`<div class="big">Round ${S.round} done</div><p>You got ${S.queue.length-S.miss.length} of ${S.queue.length} right. These need another try:</p>
      <ul class="missed">${items.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
      <div class="btnrow"><button class="btn" id="again" type="button">Start round ${S.round+1} (${S.miss.length} questions)</button><button class="btn ghost" id="toHome" type="button">Back to all parts</button></div>`;
    $("again").onclick=()=>{S.round++;S.queue=shuffle(S.miss);S.miss=[];S.i=0;prepRound();$("end").hidden=true;$("quiz").hidden=false;showQ();};
  } else {
    const pct=S.firstRight/S.firstTotal, stars=pct>=.9?3:pct>=.7?2:1;
    if(S.key!=="mix"){best[S.key]=Math.max(best[S.key]||0,stars);store.set("best",best);}
    box.innerHTML=`<div class="stars" aria-label="${stars} of 3 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
      <div class="big">${S.round===1?"Perfect round!":"Level mastered!"}</div>
      <p>First try: ${S.firstRight} of ${S.firstTotal} right${S.round>1?`. You fixed every mistake in ${S.round} rounds.`:"."}</p><p>Best streak: ${S.bestStreak} in a row.</p>
      <div class="btnrow"><button class="btn" id="toHome" type="button">Back to all parts</button><button class="btn ghost" id="replay" type="button">Play this level again</button></div>`;
    $("replay").onclick=()=>startLevel(S.key);
  }
  $("toHome").onclick=showHome;
  $("quiz").hidden=true;$("end").hidden=false;window.scrollTo(0,0);
}
$("backBtn").onclick=()=>{S=null;showHome();};
$("resetBtn").onclick=()=>{ if(confirm("Clear all your progress and your reflection draft, and start again?")){mastered={};best={};drafts={};store.set("mastered",mastered);store.set("best",best);store.set("drafts",drafts);showHome();} };
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||!S) return;
  const tag=(e.target&&e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA") return;
  const q=S.queue[S.i], idx="ABCD1234".indexOf(e.key.toUpperCase());
  if(q&&q.k==="mc"&&idx>=0&&!S.locked) answerMC(idx%4);
  else if(e.key==="Enter"&&S.locked&&document.activeElement!==$("nextBtn")) $("nextBtn").click();
});

/* ---------- reflection ---------- */
const R=DATA.reflect;
const ADJ=[...new Set(LEVELS.filter(L=>L.key==="people"||L.key==="things").flatMap(L=>L.qs.map(q=>q.o[0].toLowerCase())))];
const KWS=[...new Set(LEVELS.filter(L=>/^kw/.test(L.key)).flatMap(L=>L.qs.map(q=>q.o[0].toLowerCase())))];
const stemRe = w => w.includes(" ") ? w.replace(" ","\\s+") : w.replace(/e$/,"")+"[a-z]{0,4}";
function found(list,text){const t=text.toLowerCase();return list.filter(w=>new RegExp("\\b"+(list===ADJ?w.replace("-","\\-"):stemRe(w))+"\\b").test(t));}
function sentencesOf(t){return t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=3);}
function analyse(text){
  const sents=sentencesOf(text);
  const compound=sents.filter(s=>/,\s*(and|but|so|or|yet|for|nor)\s+\S+\s+\S+/i.test(s)).length;
  const complex=sents.filter(s=>SUBRE.test(s)&&!/^\s*(as)\b/i.test(s)).length;
  const marks=["?","!",":",";","\"","'","(","..."].filter(m=>strict(text).includes(m));
  return {words:(text.match(/[A-Za-zÀ-ÿğüşöçıİĞÜŞÖÇ'’-]+/g)||[]).length, compound, complex, adj:found(ADJ,text), kw:found(KWS,text), marks};
}
function reflectWords(){const d=drafts[drafts._p??-1]; return d?analyse((d||[]).join(" ")).words:0;}
function openReflect(){
  ["home","quiz","end"].forEach(id=>$(id).hidden=true); $("reflect").hidden=false;
  drawReflect(); window.scrollTo(0,0);
}
function drawReflect(){
  const p=drafts._p;
  const card=$("rCard");
  card.innerHTML=`<p class="ask">Choose a topic. Then write each part in its box. Tap a sentence starter to add it to the box.</p>
    <div class="prompts">${R.prompts.map((t,i)=>`<button class="prompt" type="button" aria-pressed="${p===i}" data-i="${i}">${esc(t)}</button>`).join("")}</div>
    <div id="rSteps"></div>`;
  card.querySelectorAll(".prompt").forEach(b=>b.onclick=()=>{drafts._p=+b.dataset.i; if(!drafts[drafts._p]) drafts[drafts._p]=R.steps.map(()=>""); store.set("drafts",drafts); drawReflect();});
  if(p===undefined||p===null) return;
  const d=drafts[p]||(drafts[p]=R.steps.map(()=>""));
  const steps=$("rSteps");
  steps.innerHTML=R.steps.map((s,i)=>`<div class="step"><h3><b>${i+1}</b>${esc(s.h)}</h3><p class="tip">${esc(s.tip)}</p>
      <div class="starters">${s.st.map(x=>`<button class="starter" type="button" data-s="${i}">${esc(x)}</button>`).join("")}</div>
      <textarea class="tbox" id="st${i}" rows="4" autocapitalize="sentences" spellcheck="true" aria-label="${esc(s.h)}">${esc(d[i]||"")}</textarea></div>`).join("")
    + `<div class="panel"><h4>Checklist</h4><ul class="checklist" id="chk"></ul></div>
       <div class="btnrow"><button class="btn check" id="rFinish" type="button" style="background:var(--reflect)">See my whole reflection</button><button class="btn ghost" id="rEx" type="button">Show the example reflection</button></div>
       <div id="rOut"></div><div id="rExample"></div>
       <div class="wc" id="wc"></div>`;
  steps.querySelectorAll(".starter").forEach(b=>b.onclick=()=>{
    const ta=$("st"+b.dataset.s); const add=b.textContent.replace(/\s*…\s*$/,"").replace(/…/g,"").trim()+" ";
    ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+add; ta.focus(); const L=ta.value.length; try{ta.setSelectionRange(L,L)}catch(e){}
    save();
  });
  R.steps.forEach((s,i)=>$("st"+i).addEventListener("input",save));
  $("rFinish").onclick=()=>{
    const txt=R.steps.map((s,i)=>$("st"+i).value.trim()).filter(Boolean).join(" ");
    $("rOut").innerHTML=txt?`<div class="panel"><h4>Your reflection</h4><div class="final">${esc(txt)}</div><button class="btn ghost" id="rCopy" type="button">Copy my reflection</button></div>`:`<div class="panel">Write at least one part first.</div>`;
    const c=$("rCopy"); if(c) c.onclick=async()=>{try{await navigator.clipboard.writeText(txt);c.textContent="Copied";}catch(e){c.textContent="Select the text above to copy it";}};
    $("rOut").scrollIntoView({behavior:"smooth",block:"start"});
  };
  $("rEx").onclick=()=>{
    const el=$("rExample");
    if(el.innerHTML){el.innerHTML="";$("rEx").textContent="Show the example reflection";return;}
    const mark=t=>{let h=esc(t);[...ADJ,...KWS].forEach(w=>{h=h.replace(new RegExp("\\b("+(ADJ.includes(w)?w:stemRe(w))+")\\b","gi"),'<span class="tag">$1</span>')});return h;};
    el.innerHTML=`<div class="panel example"><h4>Example reflection</h4><p style="font-family:var(--ui);font-size:14px;color:var(--ink2)">Topic: ${esc(R.prompts[R.example_prompt])} Highlighted: adjectives and key words from class.</p>${R.example.map(t=>`<p>${mark(t)}</p>`).join("")}</div>`;
    $("rEx").textContent="Hide the example reflection";
    el.scrollIntoView({behavior:"smooth",block:"start"});
  };
  save(true);
}
function save(noStore){
  const p=drafts._p; if(p===undefined) return;
  const d=drafts[p]=R.steps.map((s,i)=>$("st"+i)?$("st"+i).value:"");
  if(!noStore) store.set("drafts",drafts);
  const a=analyse(d.join(" "));
  const items=[
    [a.words>=150, `Length: ${a.words} words`, "Aim for 150–200 words."],
    [d.every(x=>x.trim().split(/\s+/).filter(Boolean).length>=8), "Every part written", "Write at least one full sentence in each box."],
    [a.compound>=2, `Compound sentences: ${a.compound}`, "Use at least 2 (comma + FANBOYS)."],
    [a.complex>=2, `Complex sentences: ${a.complex}`, "Use at least 2 (because, although, when, if…)."],
    [a.adj.length>=3, `Adjectives from class: ${a.adj.length}`, a.adj.length?a.adj.join(", "):"Use at least 3 (insecure, courageous, tedious…)."],
    [a.kw.length>=2, `Key words: ${a.kw.length}`, a.kw.length?a.kw.join(", "):"Use at least 2 (evidence, observation, diligence…)."],
    [a.marks.length>=2, `Punctuation beyond . and ,: ${a.marks.length}`, a.marks.length?a.marks.join("  "):"Use at least 2 more marks (: ; ? ! \" ' …)."],
  ];
  $("chk").innerHTML=items.map(([ok,h,s])=>`<li class="${ok?"done":""}"><span class="box">${ok?"✓":""}</span><span>${esc(h)}<small>${esc(s)}</small></span></li>`).join("");
  $("wc").innerHTML=`<span><b>${a.words}</b> words</span><span>${items.filter(x=>x[0]).length} of ${items.length} checklist points</span>`;
}
$("rBack").onclick=showHome;
showHome();
</script>
