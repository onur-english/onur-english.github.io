<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot Twist · Literature Exam 1</title>
<meta name="theme-color" content="#16323C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800;900&family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#16323C; --page2:#1D3E49; --cream:#EAF2F4; --muted:#A9C1C8; --paper:#FFFFFF; --ink:#1B2A30; --ink2:#566A72; --line:#DCE5E8; --soft:#F2F6F7;
  --elem:#F2B33D; --tools:#5FBFAE; --stories:#F28C6B; --vocab:#9DB4FF;
  --ok:#1E8A55; --okbg:#E3F5EA; --no:#C23B3B; --nobg:#FBE7E5;
  --hue:var(--elem);
  --head:"Bitter",Georgia,serif; --ui:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif; --read:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--cream);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--elem);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}

/* home */
.brand{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
.brand img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 6px}
.reset{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.arc{width:100%;height:auto;display:block;margin:8px 0 0}
.arc .path{fill:none;stroke:var(--elem);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.8s .2s ease-out forwards}
.arc .dot{fill:var(--page);stroke:var(--elem);stroke-width:2.5;opacity:0;animation:fade .3s forwards}
.arc .peak{fill:var(--elem)}
.arc text{fill:var(--muted);font-family:var(--ui);font-size:11px;opacity:0;animation:fade .4s forwards}
.arc .d1,.arc .t1{animation-delay:.3s}.arc .d2,.arc .t2{animation-delay:.6s}.arc .d3,.arc .t3{animation-delay:.9s}.arc .d4,.arc .t4{animation-delay:1.25s}.arc .d5,.arc .t5{animation-delay:1.55s}.arc .d6,.arc .t6{animation-delay:1.85s}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
h1{font-family:var(--head);font-weight:900;font-size:clamp(54px,16vw,80px);line-height:.9;letter-spacing:-.02em;margin:8px 0 0;color:#fff}
.lede{color:var(--muted);margin:12px 0 0;max-width:36ch}
.overall{margin:20px 0 0}
.overall .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--elem);width:0}
.overall p{margin:8px 0 0;color:var(--muted);font-size:14px}
.sec{margin-top:30px}
.sech{display:flex;align-items:baseline;gap:10px}
.sech h2{font-family:var(--head);font-weight:800;font-size:25px;margin:0;color:#fff}
.sech span{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-2px)}
.sec>p{margin:2px 0 12px 20px;color:var(--muted);font-size:14px}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lvl{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;background:var(--page2);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 15px;color:var(--cream)}
.lvl:active{transform:scale(.99)}
.lvl h3{font-weight:700;font-size:18px;margin:0;line-height:1.2;color:#fff}
.lvl p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.lvl .mini{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:9px;overflow:hidden}
.lvl .mini i{display:block;height:100%;background:var(--c)}
.count{font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.count.done{color:var(--c)}
.mixbtn{background:var(--elem);color:var(--ink);border:0}
.mixbtn h3{color:var(--ink)} .mixbtn p,.mixbtn .count{color:#5b4512}

/* quiz */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{background:var(--page2);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:999px;padding:7px 14px;font-size:14px}
.where{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.qhead{font-family:var(--head);font-weight:900;font-size:29px;line-height:1.05;margin:8px 0 12px;color:var(--hue)}
.track{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--hue);width:0;transition:width .3s}
.story{background:var(--soft);color:var(--ink);border-radius:12px;margin-top:16px;overflow:hidden}
.story summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.story summary::-webkit-details-marker{display:none}
.story summary span{color:var(--ink2);font-weight:600}
.story .body{max-height:46vh;overflow:auto;padding:0 16px 14px;font-family:var(--read);font-size:17px;line-height:1.6;border-top:1px solid var(--line)}
.story .body p{margin:12px 0}
.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px 18px;margin-top:16px;border-top:6px solid var(--hue)}
.label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.passage{font-family:var(--read);font-size:19px;line-height:1.6;background:var(--soft);border-left:4px solid var(--hue);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.ask{font-size:18px;font-weight:700;margin:0;line-height:1.35}
.sent{display:block;font-family:var(--read);font-size:20px;line-height:1.6;margin:0;font-weight:400}
.gap{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--hue);line-height:1.2}
.gap.filled{color:var(--ok);border-color:var(--ok);font-weight:600;min-width:0}
.bold{font-weight:700;background:color-mix(in srgb,var(--hue) 28%,#fff);padding:0 4px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:12px;padding:11px 14px;font-size:17px;line-height:1.35;color:var(--ink)}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:800;font-size:14px;color:var(--ink2)}
.opt:not(:disabled):hover{border-color:var(--hue)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--nobg);border-color:var(--no)} .opt.wrong .k{background:var(--no);color:#fff}
.opt.dim{opacity:.5}
.cells{display:grid;gap:12px;margin-top:16px}
.cell label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.cell input{width:100%;font-family:var(--read);font-size:18px;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.cell input:focus{outline:none;border-color:var(--hue)}
.cell input.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cell input.wrong{border-color:var(--no);background:var(--nobg);color:var(--no)}
.btn{display:block;width:100%;margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:18px}
.btn.check{background:var(--hue);color:var(--ink)}
.btn.ghost{background:var(--page2);color:var(--cream);border:1px solid rgba(255,255,255,.15)}
.nudge{margin-top:10px;font-size:15px;color:var(--no)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:16px}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--nobg)}
.fb strong{display:block;font-size:19px;font-weight:800;margin-bottom:4px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--no)}
.fb .ans{display:block;background:#fff;border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-weight:700;color:var(--ok)}
.streak{font-size:14px;color:var(--muted);margin-top:12px;text-align:center;min-height:1.5em}
.end{text-align:center;padding-top:20px}
.end .big{font-family:var(--head);font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1;color:var(--hue);margin:16px 0 6px}
.end p{color:var(--muted);margin:6px auto;max-width:34ch}
.stars{font-size:40px;letter-spacing:6px;margin:14px 0 0;color:var(--elem)}
.stars .off{color:rgba(255,255,255,.18)}
.missed{text-align:left;list-style:disc;background:var(--page2);border-radius:12px;padding:12px 16px 12px 36px;margin:18px 0 0;font-family:var(--read)}
.missed li{margin:4px 0}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.end .btn{background:var(--hue);color:var(--ink)} .end .btn.ghost{background:var(--page2);color:var(--cream)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.arc .path{stroke-dashoffset:0}.arc .dot,.arc text{opacity:1}}
</style>
</head>

    else $("ask").textContent=q.t;
    const box=document.createElement("div");box.className="opts";
    q.opts.forEach((o,j)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.innerHTML=`<span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span>`;b.onclick=()=>answerMC(j);box.appendChild(b);});
    work.appendChild(box);
  } else {
    $("ask").innerHTML=`<span class="label">Use context clues. Type what the word in bold could mean, and the type of clue (IDEAS).</span><span class="sent">${sentHTML(q)}</span>`;
    work.innerHTML=`<div class="cells"><div class="cell"><label for="c1">What could it mean?</label><input id="c1" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off" enterkeyhint="next"></div>
      <div class="cell"><label for="c2">Type of context clue</label><input id="c2" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off" enterkeyhint="done" placeholder="inference, example, antonym or synonym"></div></div>
      <button class="btn check" id="checkBtn" type="button">Check</button><div class="nudge" id="nudge" aria-live="polite"></div>`;
    $("checkBtn").onclick=checkClue;
    $("c1").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("c2").focus();}});
    $("c2").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();S.locked?$("nextBtn").click():checkClue();}});
  }
  window.scrollTo(0,0);
}
function finish(q,ok,html){
  const fb=$("fb");fb.hidden=false;
  if(ok){mastered[q.id]=true;store.set("mastered",mastered);if(S.round===1)S.firstRight++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    fb.className="fb ok";fb.innerHTML=`<strong>Correct!</strong>${esc(q.n)}`;}
  else{S.miss.push(q);S.streak=0;fb.className="fb no";fb.innerHTML=`<strong>Not quite. The correct answer is:</strong>${html}${esc(q.n)}<br>This one will come back in the next round.`;}
  $("streak").textContent=S.streak>=3?`${S.streak} in a row!`:"";
  const nb=$("nextBtn");nb.hidden=false;nb.textContent=S.i+1<S.queue.length?"Next question":"See my results";nb.focus({preventScroll:true});
}
function answerMC(j){
  const q=S.queue[S.i];if(S.locked)return;S.locked=true;
  [...document.querySelectorAll("#work .opt")].forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add("right");else if(k===j)b.classList.add("wrong");else b.classList.add("dim");});
  if(q.t.includes("_____"))$("ask").querySelector(".sent").innerHTML=sentHTML(q,true);
  finish(q,j===q.ans,`<span class="ans">${esc(q.opts[q.ans])}</span>`);
}
function checkClue(){
  const q=S.queue[S.i];if(S.locked)return;
  const a=$("c1"),b=$("c2");
  if(!a.value.trim()){$("nudge").textContent="Type what the word could mean first.";a.focus();return;}
  if(!b.value.trim()){$("nudge").textContent="Type the type of clue too.";b.focus();return;}
  S.locked=true;$("nudge").textContent="";
  const ok1=new RegExp(q.keys,"i").test(a.value), ok2=q.a.includes(letters(b.value));
  [a,b].forEach(e=>e.disabled=true);a.classList.add(ok1?"right":"wrong");b.classList.add(ok2?"right":"wrong");$("checkBtn").hidden=true;
  finish(q,ok1&&ok2,`<span class="ans">Meaning: ${esc(q.show)}<br>Clue: ${esc(q.a[0])}</span>`);
}
$("nextBtn").onclick=()=>{S.locked=false;S.i++;if(S.i<S.queue.length)showQ();else endRound();};
function endRound(){
  $("trackFill").style.width="100%";const box=$("endBox");
  if(S.miss.length){
    const items=[...new Set(S.miss.map(q=>q.w))];
    box.innerHTML=`<div class="big">Round ${S.round} done</div><p>You got ${S.queue.length-S.miss.length} of ${S.queue.length} right. These need another try:</p>
      <ul class="missed">${items.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
      <div class="btnrow"><button class="btn" id="again" type="button">Start round ${S.round+1} (${S.miss.length} questions)</button><button class="btn ghost" id="toHome" type="button">Back to all levels</button></div>`;
    $("again").onclick=()=>{S.round++;S.queue=shuffle(S.miss);S.miss=[];S.i=0;prepRound();$("end").hidden=true;$("quiz").hidden=false;$("storyBox").dataset.lvl="";showQ();};
  } else {
    const pct=S.firstRight/S.firstTotal,stars=pct>=.9?3:pct>=.7?2:1;
    if(S.key!=="mix"){best[S.key]=Math.max(best[S.key]||0,stars);store.set("best",best);}
    box.innerHTML=`<div class="stars" aria-label="${stars} of 3 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
      <div class="big">${S.round===1?"Perfect round!":"Level mastered!"}</div><p>First try: ${S.firstRight} of ${S.firstTotal} right${S.round>1?`. You fixed every mistake in ${S.round} rounds.`:"."}</p><p>Best streak: ${S.bestStreak} in a row.</p>
      <div class="btnrow"><button class="btn" id="toHome" type="button">Back to all levels</button><button class="btn ghost" id="replay" type="button">Play this level again</button></div>`;
    $("replay").onclick=()=>{$("storyBox").dataset.lvl="";startLevel(S.key);};
  }
  $("toHome").onclick=()=>{$("storyBox").dataset.lvl="";$("storyBox").innerHTML="";showHome();};
  $("quiz").hidden=true;$("end").hidden=false;window.scrollTo(0,0);
}
$("backBtn").onclick=()=>{S=null;$("storyBox").dataset.lvl="";$("storyBox").innerHTML="";showHome();};
$("resetBtn").onclick=()=>{if(confirm("Clear all your progress and start again?")){mastered={};best={};store.set("mastered",mastered);store.set("best",best);showHome();}};
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||!S)return;const tag=(e.target&&e.target.tagName)||"";if(tag==="INPUT")return;
  const q=S.queue[S.i],idx="ABCD1234".indexOf(e.key.toUpperCase());
  if(q&&q.k==="mc"&&idx>=0&&idx%4<q.opts.length&&!S.locked)answerMC(idx%4);
  else if(e.key==="Enter"&&S.locked&&document.activeElement!==$("nextBtn"))$("nextBtn").click();
});
showHome();
</script>
</body>
