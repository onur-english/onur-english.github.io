<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Diary of Anne Frank · Exam Revision</title>
<meta name="description" content="Grade 8 exam revision: Anne Frank vocabulary, comprehension and essay writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Special+Elite&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6e9; --paper2:#f4ecd6; --card:#fffdf7; --ink:#1d2742; --ink2:#4a5370;
  --red:#b3262e; --red2:#8a1b22; --rose:#f7dcdc; --gold:#b8893a; --gold2:#f3e6c8;
  --line:#ddd2b6; --rule:#e9e0c8; --ok:#2e6a4c; --okbg:#e2f1e8; --bad:#b3262e; --badbg:#fbe4e2;
  --blue:#2c4a8a; --shadow:0 1px 0 rgba(29,39,66,.06),0 8px 24px -14px rgba(29,39,66,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
.type{font-family:"Special Elite","Courier New",monospace;letter-spacing:.02em}
.hand{font-family:Caveat,cursive}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
/* gingham cover band, like Anne's checked diary */
.gingham{background-color:#fff;background-image:
  linear-gradient(90deg,rgba(179,38,46,.55) 50%,transparent 50%),
  linear-gradient(rgba(179,38,46,.55) 50%,transparent 50%);
  background-size:22px 22px}
.cover{position:relative;border-radius:0 0 22px 22px;overflow:hidden;box-shadow:var(--shadow)}
.cover .band{height:118px}
.cover .label{position:relative;margin:-74px 16px 0;background:var(--card);border:2px solid var(--red2);border-radius:12px;padding:16px 16px 14px;box-shadow:var(--shadow);text-align:center}
.cover .label:before{content:"";position:absolute;inset:5px;border:1px dashed rgba(138,27,34,.45);border-radius:8px;pointer-events:none}
.logo{width:92px;height:auto;display:block;margin:0 auto 6px}
.cover h1{font-size:30px;color:var(--red2);letter-spacing:-.01em}
.cover .sub{margin-top:6px;font-size:14px;color:var(--ink2)}
.cover .clasp{position:absolute;right:-6px;top:38px;width:34px;height:48px;background:linear-gradient(#c9a04f,#8a6a2a);border-radius:6px 0 0 6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.meter{margin:18px 0 6px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.meter .bar{flex:1;height:10px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:width .4s}
.note{background:var(--gold2);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:15px;margin:14px 0}
/* chapter cards */
.chapters{display:grid;gap:14px;margin-top:16px}
.chap{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px 22px;position:relative;box-shadow:var(--shadow)}
.chap:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:14px 0 0 14px;background:var(--c,var(--red))}
.chap .kick{font-size:12px;color:var(--c,var(--red));text-transform:uppercase}
.chap h2{font-size:22px;margin:2px 0 4px}
.chap p{margin:0;font-size:15px;color:var(--ink2)}
.chap .prog{margin-top:8px;font-size:13px;color:var(--ink2)}
.chap .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chap .dots b{width:10px;height:10px;border-radius:3px;background:var(--paper2);border:1px solid var(--line)}
.chap .dots b.on{background:var(--c,var(--red));border-color:var(--c,var(--red))}
/* top bar inside views */
.top{position:sticky;top:0;z-index:5;background:rgba(251,246,233,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.top .t{font-family:Fraunces,serif;font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mini{width:44px;height:auto}
.vhead{margin:4px 0 12px}
.vhead .kick{font-size:12px;text-transform:uppercase;color:var(--red)}
.vhead h2{font-size:26px}
.vhead p{margin:6px 0 0;color:var(--ink2);font-size:15px}
.acts{display:grid;gap:10px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.act .n{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:var(--red2);font-family:Fraunces,serif;font-weight:800}
.act .x{flex:1;min-width:0}
.act .x b{display:block;font-family:Fraunces,serif;font-size:17px}
.act .x span{font-size:14px;color:var(--ink2)}
.act .st{flex:none;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.act .st.done{background:var(--okbg);color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.group-h{font-size:13px;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px;letter-spacing:.04em}
/* quiz */
.board{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.board i{width:12px;height:12px;border-radius:3px;background:var(--paper2);border:1px solid var(--line)}
.board i.g{background:var(--gold);border-color:var(--gold)}
.board i.n{background:var(--ink);border-color:var(--ink)}
.board i.m{background:#fff;border:2px solid var(--red)}
.board i.cur{outline:2px solid var(--blue);outline-offset:1px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:6px}
.page{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;box-shadow:var(--shadow)}
.page .ref{font-size:12px;color:var(--red);margin-bottom:6px}
.q{font-size:19px;font-weight:600;margin:0 0 14px;line-height:1.4}
.q .gap{display:inline-block;min-width:80px;border-bottom:2px solid var(--ink);margin:0 3px;height:1em;vertical-align:-2px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:16px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--paper2);font-family:Fraunces,serif;font-weight:700;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15.5px}
.fb.ok{background:var(--okbg);border:1px solid #b8dcc7}
.fb.no{background:var(--badbg);border:1px solid #f0b9b4}
.fb.show{background:var(--gold2);border:1px solid #e5cf9c}
.fb b.h{font-family:Fraunces,serif;display:block;font-size:17px;margin-bottom:2px}
.fb .small{font-size:13px;color:var(--ink2);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;font-family:Fraunces,serif;font-weight:700;font-size:16px;background:var(--ink);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.wide{width:100%;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.typein{display:flex;align-items:stretch;gap:0;margin:4px 0 0}
.typein .first{display:grid;place-items:center;padding:0 12px;background:var(--ink);color:#fff;border-radius:10px 0 0 10px;font-family:"Special Elite",monospace;font-size:20px}
.typein input{flex:1;min-width:0;font:inherit;font-size:19px;padding:11px 12px;border:1.5px solid var(--ink);border-left:0;border-radius:0 10px 10px 0;background:#fff}
.typein input:focus{outline:3px solid rgba(44,74,138,.25)}
.typein.ok input{border-color:var(--ok);background:var(--okbg)}
.typein.no input{border-color:var(--bad);background:var(--badbg)}
.result{text-align:center}
.result .big{font-family:Fraunces,serif;font-size:48px;font-weight:800;color:var(--red2);line-height:1}
.revise{text-align:left;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.revise li{margin:6px 0;font-size:15px}
/* script lines (quote lab, PEEL bank) */
.script{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;box-shadow:var(--shadow)}
.line{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 16px}
.line:last-child{border-bottom:0}
.line .sp{font-family:"Special Elite",monospace;font-size:13px;color:var(--red2);text-transform:uppercase;letter-spacing:.05em}
.line .sp em{font-style:normal;color:var(--ink2);text-transform:none;letter-spacing:0;margin-left:6px}
.line .qt{display:block;font-size:17px;margin-top:2px}
.line .tap{font-size:12px;color:var(--blue)}
.line.sel{background:var(--gold2)}
.line.done .sp:after{content:" ✓";color:var(--ok)}
.panel{margin:0 10px 12px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.strip{background:var(--ink);color:#fff;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.strip b{font-family:"Special Elite",monospace;font-weight:400;color:#f3d48c;margin-right:6px}
.panel .task{font-weight:600;margin-bottom:8px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.45;border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:110px;background:var(--paper);resize:vertical}
textarea:focus{outline:3px solid rgba(44,74,138,.2);border-color:var(--blue)}
.wc{font-size:13px;color:var(--ink2);text-align:right;margin-top:2px}
.model{margin-top:10px;background:var(--paper2);border-radius:10px;padding:10px 12px;font-size:15.5px}
.model .hand{font-size:22px;color:var(--red2);display:block;line-height:1}
.checks{list-style:none;padding:0;margin:10px 0 0;font-size:15px}
.checks li{padding:3px 0 3px 26px;position:relative}
.checks li:before{position:absolute;left:0;font-weight:700}
.checks li.y:before{content:"✓";color:var(--ok)}
.checks li.n:before{content:"✗";color:var(--bad)}
.peelbox{margin-top:10px}
.peelbox label{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-weight:700;font-size:15px;margin-bottom:4px}
.peelbox label i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:#fff;font-family:Fraunces,serif}
.peelbox textarea{min-height:70px}
.peelbox .tip{font-size:13px;color:var(--ink2);margin:0 0 4px}
.cP{background:#2c4a8a}.cE1{background:#b8893a}.cE2{background:#2e6a4c}.cL{background:#8a1b22}
/* label the paragraph */
.para{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);font-size:17px}
.sent{display:inline;background:none;border:0;padding:0;text-align:left;font-size:17px;line-height:1.7;border-bottom:2px dotted var(--blue)}
.sent.lab{border-bottom:0}
.sent .tag{display:inline-block;font-family:Fraunces,serif;font-weight:700;font-size:12px;color:#fff;border-radius:5px;padding:0 6px;margin-right:4px;vertical-align:2px}
.labrow{display:block;margin:8px 0 10px;padding:10px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.labrow .lbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.labrow .lbs button{border:0;border-radius:8px;padding:8px 10px;color:#fff;font-family:Fraunces,serif;font-weight:700;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin:8px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* timeline */
.tl{display:grid;gap:8px}
.tl button{text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:16px}
.tl button.shake{animation:shake .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.placed{counter-reset:n;list-style:none;padding:0;margin:0 0 14px}
.placed li{counter-increment:n;position:relative;padding:8px 10px 8px 40px;border-left:3px solid var(--red);margin-left:12px;font-size:15.5px;background:var(--card)}
.placed li:before{content:counter(n);position:absolute;left:-14px;top:7px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:13px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.lesson h3{font-size:20px;color:var(--red2);margin-bottom:8px}
.lesson dl{margin:0}
.lesson dt{font-family:Fraunces,serif;font-weight:700;margin-top:8px}
.lesson dd{margin:2px 0 0;font-size:15.5px}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--ink2)}
.foot img{width:64px;opacity:.9}
@media (min-width:600px){.cover h1{font-size:38px}.chapters{grid-template-columns:1fr 1fr}.chap.wide{grid-column:1/-1}}
@media print{.top,.btn,.back{display:none}}
</style>
</head>

<script id="data" type="application/json">{"vocab": [{"word": "compassionate", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "Miep is a ______ friend: she risks her own safety every day to bring food and news to the families in hiding.", "a": "compassionate", "w": ["extravagant", "conspicuous", "insufferable"], "hint": "Think of a word for someone who cares deeply about other people's suffering.", "why": "Compassionate means caring about other people's pain and wanting to help. Miep helps the families even though it is dangerous."}, "wr": {"s": "Mr. Frank is c______ towards Mr. Van Daan after the theft: he understands that hunger made him weak and he does not want him sent outside to die.", "first": "c", "accept": ["compassionate"], "hint": "The word describes someone full of kindness and sympathy."}}, {"word": "abruptly", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "The Hanukkah celebration stops ______ when a loud crash comes from the office below.", "a": "abruptly", "w": ["studiously", "ostentatiously", "persistently"], "hint": "The crash is sudden and unexpected. Which word means 'suddenly, without warning'?", "why": "Abruptly means suddenly and without warning. The noise downstairs cuts the celebration off in a second."}, "wr": {"s": "Anne and Peter's quiet moment at the window ends a______ when the police break into the annex.", "first": "a", "accept": ["abruptly"], "hint": "The moment ends suddenly, with no warning at all."}}, {"word": "emigrate", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "Before the war, the Frank family had to ______ from Germany to Holland to escape the Nazis.", "a": "emigrate", "w": ["rejoice", "plead", "indicate"], "hint": "Which verb means to leave your own country and go to live in another one?", "why": "To emigrate is to leave your country to live in a new one. The Franks left Germany for Holland."}, "wr": {"s": "Many Jewish families tried to e______ to other countries, but most countries let very few of them in.", "first": "e", "accept": ["emigrate"], "hint": "This verb means leaving your home country forever."}}, {"word": "plead", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "Margot and Anne ______ with their mother to calm down when she orders the Van Daans to leave.", "a": "plead", "w": ["rejoice", "compete", "celebrate"], "hint": "The girls are begging their mother to change her mind.", "why": "To plead is to beg someone seriously and emotionally. Anne and Margot beg their mother to come to her senses."}, "wr": {"s": "In Act 2, Scene 3, Mr. Frank has to p______ with his wife to let Mr. Van Daan stay, because he would not survive outside.", "first": "p", "accept": ["plead"], "hint": "Mr. Frank is begging his wife to change her mind."}}, {"word": "conspicuous", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "The yellow Star of David made Jewish people ______, so everyone could see who they were.", "a": "conspicuous", "w": ["dignified", "bearable", "extravagant"], "hint": "The star was designed so that people would stand out and be noticed.", "why": "Conspicuous means very easy to notice. The star marked Jewish people so the Nazis could target them."}, "wr": {"s": "A family carrying suitcases through the streets would look too c______, so the Franks wear layers of clothes instead.", "first": "c", "accept": ["conspicuous"], "hint": "Suitcases would make them stand out and attract attention."}}, {"word": "ration", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "The adults argue about food because each person's ______ of bread and potatoes is so small.", "a": "ration", "w": ["remorse", "gesture", "ideal"], "hint": "This noun means the fixed amount of food each person is allowed.", "why": "A ration is the limited amount of food a person is allowed to have. In wartime, food was strictly limited."}, "wr": {"s": "Food is so short during the war that the government has to r______ it, so each family may buy only a small amount.", "first": "r", "accept": ["ration"], "hint": "Here the word is a verb: to control how much food each person gets."}}, {"word": "unabashed", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "Anne is ______: she says exactly what she thinks to the adults and does not feel embarrassed about it.", "a": "unabashed", "w": ["inarticulate", "downcast", "meticulous"], "hint": "Which word describes someone who is not shy or embarrassed at all?", "why": "Unabashed means not embarrassed or ashamed. Anne speaks her mind freely, even to the adults."}, "wr": {"s": "Peter is shy, but Anne is u______ and talks loudly about her dream of going to Paris.", "first": "u", "accept": ["unabashed"], "hint": "Anne is the opposite of shy; she is not embarrassed at all."}}, {"word": "peculiar", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "At first Anne thinks Peter is a ______ boy because he is so quiet and keeps to himself.", "a": "peculiar", "w": ["dignified", "extravagant", "elegant"], "hint": "Anne finds Peter strange and unusual at first.", "why": "Peculiar means strange or unusual. Quiet Peter seems odd to talkative Anne."}, "wr": {"s": "Life in the annex is p______: during the working day nobody may run water or even speak above a whisper.", "first": "p", "accept": ["peculiar"], "hint": "The rules make daily life very strange and unusual."}}, {"word": "inherited", "scene": "Act 1 · Scenes 1–2", "mc": {"q": "Mrs. Van Daan treats her fur coat like a family treasure she ______ from her father, so she is horrified when her husband wants to sell it.", "a": "inherited", "w": ["borrowed", "purchased", "rejected"], "hint": "The coat came to her from her father and is a family treasure.", "why": "To inherit is to receive something from a parent or older relative. The coat came from her father, which is why it matters so much."}, "wr": {"s": "Things you i______ from your parents can mean a lot to you, like Mrs. Van Daan's coat, a present from her father.", "first": "i", "accept": ["inherit", "inherited"], "hint": "The verb means receiving something that belonged to a parent."}}, {"word": on the day the police discover the hiding place"], "hint": "The play begins after the war is over, with Mr. Frank alone.", "why": "The play starts in November 1945. Mr. Frank comes back to the empty hiding place, so the audience knows something terrible happened.", "ref": "Act 1 · Scene 1"}, {"q": "In Scene 1, what makes Mr. Frank break down?", "a": "Finding a woman's white glove on the floor of the empty rooms", "w": ["Hearing Miep say that the office will close down for good", "Seeing the Hanukkah candles still standing on the table", "Reading a letter that Mr. Kraler had left for him there"], "hint": "It is a small object that belonged to a woman in his family.", "why": "A woman's white glove reminds him of his lost family, and he breaks down.", "ref": "Act 1 · Scene 1"}, {"q": "What does Mr. Frank first tell Miep to do with the papers she saved?", "a": "Burn them, all of them", "w": ["Send them to the newspaper", "Keep them safe in the office", "Give them to Mr. Kraler"], "hint": "He thinks the memories are too painful to keep.", "why": "He says, \"Burn them. All of them.\" Then Miep gives him Anne's diary, and he starts to read it.", "ref": "Act 1 · Scene 1"}, {"q": "How does the play move from 1945 back to 1942?", "a": "Mr. Frank reads the diary aloud, then Anne's voice takes over the story", "w": ["Miep tells Mr. Frank the whole story of what happened in the annex", "Mr. Kraler reads out the names of everyone who lived in the annex", "Anne appears as a ghost and explains what happened to her family"], "hint": "This storytelling technique is called a flashback.", "why": "Mr. Frank begins reading Anne's diary aloud, and Anne's voice takes over. The play flashes back to July 1942.", "ref": "Act 1 · Scene 1"}, {"q": "Why does Anne arrive at the annex wearing many layers of clothes?", "a": "Carrying suitcases through the streets would have looked suspicious", "w": ["It was a freezing winter morning and the annex had no heating", "She wanted to bring presents for everyone hidden under her coat", "The Nazis had taken away all of the family's suitcases and bags"], "hint": "Think about how the family could travel without being noticed.", "why": "Suitcases would show that the family was running away, so they wore their clothes instead.", "ref": "Act 1 · Scene 2"}, {"q": "What does Peter do with his yellow Star of David?", "a": "He rips it off his clothes and plans to burn it", "w": ["He gives it to Anne so she can keep it as a souvenir", "He sews it more tightly onto his jacket and coat", "He hides it inside Mouschi's basket under the blanket"], "hint": "Peter wants nothing more to do with the star.", "why": "Peter tears off the star and plans to burn it. It shows his anger at being marked and treated differently.", "ref": "Act 1 · Scene 2"}, {"q": "Why does Mr. Frank stop Anne when she wants to go down to the office for a pencil?", "a": "It isn't safe; she must never go beyond the door to the annex", "w": ["The office is locked and only Mr. Kraler has the only key", "He wants her to write her diary in ink instead of pencil", "She has to finish unpacking her things before she goes"], "hint": "Think about the rules of hiding.", "why": "Mr. Frank tells Anne she can never go beyond the door. This is when Anne understands what hiding really means.", "ref": "Act 1 · Scene 2"}, {"q": "What does Mr. Kraler ask the families to do in Scene 3?", "a": "Take in Mr. Dussel, a Jewish dentist who is in trouble", "w": ["Move to a bigger hiding place out in the country", "Start working quietly in the office in the evenings", "Give some of their food to the workers downstairs"], "hint": "A new person needs a place to hide.", "why": "Mr. Kraler asks them to take in Mr. Dussel, a dentist. The families agree, even though space and food are short.", "ref": "Act 1 · Scene 3"}, {"q": "What is Anne's nightmare about in Scene 4?", "a": "The Green Police dragging her away, as they took her friend Jopie", "w": ["Losing her diary and having all her secrets read aloud", "Mr. Van Daan eating all of the food in the cupboard", "Failing her lessons and being sent away from school"], "hint": "Her worst fear is being caught.", "why": "Anne dreams that the Green Police are dragging her away, as they took Jopie. It shows her hidden fear.", "ref": "Act 1 · Scene 4"}, {"q": "What interrupts the Hanukkah celebration in Scene 5?", "a": "A loud noise from downstairs; a thief has broken in", "w": ["Miep arrives with news that the war has ended", "Mr. Kraler comes up to say the police are near", "The telephone rings again and again in the office"], "hint": "Someone else is in the building.", "why": "A noise comes from below. Mr. Frank goes down and finds that a thief stole some money and a radio.", "ref": "Act 1 · Scene 5"}, {"q": "Why does the thief frighten everyone so much?", "a": "He may have heard them and could tell the police about them", "w": ["He stole all of the food that Miep had brought for them", "He broke the secret door and now everyone can see it", "He is still hiding in the building somewhere downstairs"], "hint": "What could the thief do with what he knows?", "why": "The thief might report them, and they have nowhere else to go and no other place to hide.", "ref": "Act 1 · Scene 5"}, {"q": "At the start of Act 2, how long have the families been in hiding?", "a": "A year, five months and twenty-five days", "w": ["Two months and three days", "Exactly three full years", "Six weeks and four days"], "hint": "Act 2 begins on New Year's Day, 1944.", "why": "Anne's diary entry counts a year, five months and twenty-five days. Life seems to be at a standstill.", "ref": "Act 2 · Scene 1"}, {"q": "What does Mr. Kraler report about Carl, the worker downstairs?", "a": "Carl wants twenty guilders more a week, which looks like blackmail", "w": ["Carl has found the secret door and wants to come upstairs", "Carl has stolen the radio and the money from the office", "Carl has offered to bring the families extra food each week"], "hint": "Carl asks for money and seems to suspect something.", "why": "Carl demands more money and has been asking questions. Mr. Kraler suspects blackmail, and Mr. Frank says, \"Offer him half.\"", "ref": "Act 2 · Scene 1"}, {"q": "When Anne goes to Peter's room in Scene 2, what does Mrs. Frank ask her?", "a": "Not to shut the door", "w": ["To come back in ten minutes", "To take Margot with her", "To bring Peter's books back"], "hint": "Mrs. Frank is worried about her daughter being alone with a boy.", "why": "Mrs. Frank asks Anne not to shut the door. She is uneasy about the relationship.", "ref": "Act 2 · Scene 2"}, {"q": "How does Scene 2 end?", "a": "Peter kisses Anne on the cheek", "w": ["Anne and Peter have a bitter fight", "Mrs. Van Daan locks Peter's door", "Anne decides to stop visiting Peter"], "hint": "Their friendship has become something more.", "why": "Peter kisses Anne on the cheek. Their friendship has turned into young love.", "ref": "Act 2 · Scene 2"}, {"q": "What starts the big fight in Act 2, Scene 3?", "a": "Mrs. Frank catches Mr. Van Daan taking bread from the food safe", "w": ["Dussel catches Peter reading Anne's diary in the night", "Mrs. Van Daan finds out that her coat has been sold", "Anne breaks Mrs. Van Daan's best cup during dinner"], "hint": "It happens at night, near the food.", "why": "Mrs. Frank sees Mr. Van Daan stealing bread and wakes everyone. Food is so scarce that this feels like a terrible crime.", "ref": "Act 2 · Scene 3"}, {"q": "What news does Miep bring in Scene 3?", "a": "The invasion has begun", "w": ["The war is completely over", "Carl has left his job", "Mr. Kraler is in hospital"], "hint": "It is news about the Allied armies.", "why": "Miep rushes in shouting, \"The invasion has begun!\" The mood changes from frenzy to joy in seconds.", "ref": "Act 2 · Scene 3"}, {"q": "In Scene 4, why does Mr. Frank refuse to answer the ringing telephone?", "a": "Answering it could show that someone is in the building", "w": ["He is sure that the caller is only Mr. Kraler", "He is too ill and too tired to go down the stairs", "He has promised Miep that he will never answer it"], "hint": "Think about the danger of making any noise or movement.", "why": "Dussel wants him to answer, but Mr. Frank refuses to do anything that might show they are in the building.", "ref": "Act 2 · Scene 4"}, {"q": "How does Act 2, Scene 4 end?", "a": "The police break in and give everyone five minutes to pack", "w": ["Miep arrives to say they must move to a new hiding place", "Mr. Frank calls the families together to pray for peace", "Anne and Peter escape through a window into the street"], "hint": "This is the moment the families have feared for two years.", "why": "The police break into the annex. Anne's voice tells us they were allowed five minutes to get their things.", "ref": "Act 2 · Scene 4"}, {"q": "In Scene 5, where does Mr. Frank say Anne died?", "a": "Belsen, a camp in Germany", "w": ["Auschwitz, a camp in Poland", "Westerbork, a camp in Holland", "Amsterdam, after the war"], "hint": "Mr. Frank heard it from a woman who had been in that camp with Anne.", "why": "Mr. Frank learned from a woman who had been there with Anne that she died at Belsen.", "ref": "Act 2 · Scene 5"}, {"q": "On the journey after the arrest, what does Mr. Frank say made Anne happy?", "a": "Being out in the sunshine and the fresh air she loved", "w": ["Knowing that her diary would one day be published", "Hearing that the Allies had freed the whole of Holland", "Being able to talk to Peter openly for the first time"], "hint": "She had been indoors for two years.", "why": "Mr. Frank says Anne was happy to be \"out in the sunshine and the fresh air that she loved.\"", "ref": "Act 2 · Scene 5"}], "characters": [{"q": "How does Anne change from Act 1 to Act 2?", "a": "From a noisy, careless girl to a thoughtful young woman who can see her own faults", "w": ["From a shy, silent girl to a loud girl who argues with everyone in the annex", "From a hopeful girl to a bitter girl who believes people are cruel at heart", "From a girl who loves her mother to a girl who refuses to speak to her"], "hint": "Think about how Anne talks about her mother in Act 2, Scene 3.", "why": "In Act 1 Anne is loud and often rude. By Act 2 she reflects on her behavior (\"Look at me, the way I've treated Mother\") and still keeps her hope.", "ref": "Anne"}, {"q": "Which line best shows that, by Act 2, Anne can see her own faults?", "a": "\"Look at me, the way I've treated Mother.\"", "w": ["\"You are the most intolerable, insufferable boy...\"", "\"I love you, Father. I don't love anyone but you.\"", "\"We're trying to hold onto some kind of ideals.\""], "hint": "Look for the line where Anne judges her own behavior.", "why": "In Act 2, Scene 3 Anne admits she has been unfair to her mother. Being able to see your own faults is a sign of maturity.", "ref": "Anne"}, {"q": "What kind of person is Mr. Frank throughout the play?", "a": "A calm leader and peacemaker who tries to keep the group together", "w": ["A strict father who punishes Anne whenever she breaks the rules", "A selfish man who thinks only of his own family's safety", "A nervous man who panics whenever there is any danger"], "hint": "Think of how he acts during the theft and the phone call.", "why": "Mr. Frank keeps peace: he asks Mrs. Frank to let Mr. Van Daan stay, warns that they are destroying themselves, and stays calm when the phone rings.", "ref": "Mr. Frank"}, {"q": "How is Mrs. Frank different in Act 2, Scene 3 from the rest of the play?", "a": "The usually quiet, gentle woman suddenly explodes with anger", "w": ["The usually angry woman suddenly becomes calm and gentle", "The usually brave woman suddenly becomes too afraid to speak", "The usually kind woman suddenly starts stealing food herself"], "hint": "Remember \"Take your things and get out!\"", "why": "Mrs. Frank is normally quiet and gentle, so her rage at Mr. Van Daan shocks everyone. She is protecting the children's food.", "ref": "Mrs. Frank"}, {"q": "What does Margot's line \"Sometimes I wish the end would come . . . whatever it is\" show about her?", "a": "The long wait in fear is wearing her down", "w": ["She is excited to leave for a new hiding place", "She is joking to make everyone feel better", "She is angry with Anne for spending time with Peter"], "hint": "Margot is usually calm. Why would she say something so dark?", "why": "Margot is tired of living in fear. She would rather face the end than keep waiting.", "ref": "Margot"}, {"q": "How does Peter change during the play?", "a": "From a shy boy who teases Anne to a close friend who shares his feelings with her", "w": ["From a close friend of Anne to a boy who refuses to speak to anyone", "From a hopeful boy to a boy who believes people are good at heart", "From a boy who loves his cat to a boy who wants to get rid of it"], "hint": "Compare Act 1, Scene 3 with Act 2, Scene 2.", "why": "In Act 1 Peter calls Anne \"Mrs. Quack Quack\". By Act 2 he talks to her about his feelings and kisses her.", "ref": "Peter"}, {"q": "Which actions show that Mr. Van Daan is selfish?", "a": "He wants to sell his wife's coat for cigarettes and steals bread at night", "w": ["He refuses to share his cat and complains about Peter's school lessons", "He takes Anne's diary and reads it aloud to the other adults", "He tells Mr. Kraler to stop bringing food for the Franks"], "hint": "Think about the fur coat and the food safe.", "why": "Mr. Van Daan puts his own wants first: he wants cigarettes and secretly takes the shared bread.", "ref": "Mr. Van Daan"}, {"q": "Why does Mrs. Van Daan care so much about her fur coat?", "a": "Her father gave it to her", "w": ["She plans to sell it later", "It keeps her warm at night", "It belongs to Mrs. Frank"], "hint": "Her exact words are \"My father gave me that!\"", "why": "The coat is a gift from her father and a link to her life before the war.", "ref": "Mrs. Van Daan"}, {"q": "Which behavior shows Dussel's selfish side in Act 2?", "a": "He is glad the Van Daans may leave and recounts the potatoes for himself", "w": ["He refuses to share his room and makes Anne sleep on the floor", "He reads Anne's diary and tells everyone what she wrote", "He takes the radio from the office without asking anyone"], "hint": "Think about the potatoes after the theft.", "why": "When Mrs. Frank orders the Van Daans out, Dussel is pleased because there will be more food, and he greedily recounts the potatoes.", "ref": "Dussel"}, {"q": "Which word best describes Miep?", "a": "Brave", "w": ["Selfish", "Careless", "Jealous"], "hint": "She risks her life every day for the families.", "why": "Miep risks her own safety to bring food and news. In Scene 1 she also looks after Mr. Frank and saves Anne's diary.", "ref": "Miep"}, {"q": "What do the helpers Miep and Mr. Kraler have in common?", "a": "Both risk their own safety to keep the families alive", "w": ["Both are hiding in the annex together with the families", "Both want to be paid for every visit they make to the annex", "Both betray the families to the police at the end"], "hint": "Think about why they visit the annex at all.", "why": "Miep and Mr. Kraler bring food and news even though helping Jews was extremely dangerous.", "ref": "Miep and Mr. Kraler"}], "conflicts": [{"q": "What is the main external conflict of the play?", "a": "The Jewish families against the Nazis who want to find and arrest them", "w": ["Anne against Peter, who teases her all through Act 1 and Act 2", "Mr. Frank against Mr. Kraler about how to run the business", "Miep against the workers in the office downstairs"], "hint": "An external conflict is a struggle against an outside force.", "why": "The families are in danger from the Nazis. Every rule of the annex comes from this conflict.", "ref": "Conflict"}, {"q": "Which is an example of an internal conflict?", "a": "Anne struggling to become the better person she wants to be", "w": ["Mrs. Frank ordering the Van Daans to leave the annex", "The police breaking into the annex at the end of Scene 4", "The adults arguing about who should cut the cake"], "hint": "An internal conflict happens inside a character's own mind.", "why": "Anne fights with her own behavior and feelings as she grows up. That struggle happens inside her.", "ref": "Conflict"}, {"q": "What is the main cause of the conflict between Anne and her mother?", "a": "Anne feels her mother doesn't understand her and is closer to her father", "w": ["Mrs. Frank wants Anne to stop seeing Miep and Mr. Kraler", "Anne blames her mother for choosing such a small hiding place", "Mrs. Frank reads Anne's diary without asking her first"], "hint": "Remember \"I love you, Father. I don't love anyone but you.\"", "why": "Anne is close to her father and feels her mother doesn't understand her. Mrs. Frank is hurt when Anne turns her away.", "ref": "Conflict"}, {"q": "Why does Mr. Van Daan clash with Anne in Act 1?", "a": "He thinks she talks too much and is too rude for a girl", "w": ["He thinks she is lazy and never helps with the cooking", "He thinks she is too quiet and never joins in the talk", "He thinks she is taking too much food at every meal"], "hint": "Remember \"A man likes a girl who'll listen to him once in a while.\"", "why": "Mr. Van Daan wants Anne to be quiet and listen. Anne doesn't want to change who she is.", "ref": "Conflict"}, {"q": "What does food cause again and again in the annex?", "a": "Suspicion and arguments, because there is never enough", "w": ["Celebrations, because Miep brings so much of it", "Boredom, because the meals are always the same", "Sickness, because the food is always old and bad"], "hint": "Think of the cake, the bread and the potatoes.", "why": "Hunger makes people suspicious: the adults argue over the cake, Mr. Van Daan steals bread and Dussel recounts the potatoes.", "ref": "Conflict"}, {"q": "Mr. Frank says, \"We don't need the Nazis to destroy us. We're destroying ourselves.\" What does he mean?", "a": "Their own fighting is as dangerous as the enemy outside", "w": ["The Nazis have stopped looking for Jews in Amsterdam", "The annex is old and falling apart around them", "They should give up and hand themselves to the police"], "hint": "Think about what fighting does to a group that must stay together.", "why": "Mr. Frank warns that anger and distrust are tearing the group apart from inside, just as the Nazis threaten them from outside.", "ref": "Act 2 · Scene 3"}, {"q": "What is Peter's inner struggle in Act 2, Scene 4?", "a": "He can't find any meaning or hope in their suffering", "w": ["He can't decide whether to tell Anne about Margot", "He can't choose between his cat and his parents", "He can't remember the lessons Mr. Frank taught him"], "hint": "Remember his bitter question \"and all for what?\"", "why": "Peter feels angry and hopeless. Anne tries to give him hope by saying people are really good at heart.", "ref": "Act 2 · Scene 4"}], "attitudes": [{"q": "Mrs. Frank tells Anne, \"I'm afraid for other people, that you'll walk on them.\" What is she worried about?", "a": "Anne's rude behavior may hurt other people", "w": ["Other people will bully and hurt Anne", "Anne walks too loudly during the day", "Anne may run away from the annex"], "hint": "The worry is about how Anne treats others, not how others treat Anne.", "why": "Mrs. Frank fears Anne's careless words will hurt the others in the crowded annex.", "ref": "Act 1 · Scene 3"}, {"q": "When Anne says \"I don't love anyone but you\" to her father, he answers reproachfully, \"Annele!\" What does this show?", "a": "He wants Anne to love and respect her mother too", "w": ["He is angry that Anne woke him in the night", "He doesn't believe that Anne really loves him", "He wants Anne to go back to sleep straight away"], "hint": "\"Reproachfully\" means showing disappointment.", "why": "Mr. Frank is disappointed: he doesn't want Anne to reject her mother.", "ref": "Act 1 · Scene 4"}, {"q": "How does Mrs. Frank react when Anne turns her away after the nightmare?", "a": "She hides her hurt", "w": ["She shouts at Anne", "She laughs it off", "She leaves the annex"], "hint": "She is deeply hurt but doesn't show it in front of Anne.", "why": "Mrs. Frank hides her hurt. It shows how painful Anne's rejection is for her.", "ref": "Act 1 · Scene 4"}, {"q": "How does Peter treat Anne in Act 1?", "a": "He teases her and calls her \"Mrs. Quack Quack\"", "w": ["He protects her and defends her from his father", "He ignores her and never says a word to her", "He asks her for help with all his lessons"], "hint": "The nickname makes fun of her constant talking.", "why": "Peter teases Anne for talking so much. Anne calls him \"insufferable.\"", "ref": "Act 1 · Scene 3"}, {"q": "How does Mr. Frank treat Mr. Van Daan after the theft?", "a": "He defends him and asks his wife to let him stay", "w": ["He agrees with his wife that he must leave at once", "He refuses to speak to him ever again", "He reports him to Miep and Mr. Kraler"], "hint": "Mr. Frank knows what would happen to Mr. Van Daan outside.", "why": "Mr. Frank shows compassion: he knows Mr. Van Daan would not survive outside, and he tries to calm his wife.", "ref": "Act 2 · Scene 3"}, {"q": "Even while she is furious, Mrs. Frank offers the Van Daans money. What does this show?", "a": "She is angry, but she is not cruel", "w": ["She wants them to buy more bread", "She is trying to bribe Dussel too", "She wants to pay Carl the blackmail"], "hint": "Think about what the money is for.", "why": "She wants them to have a chance to find another place. Her anger hasn't destroyed her kindness.", "ref": "Act 2 · Scene 3"}, {"q": "After the invasion news, how does the mood between the adults change?", "a": "Mr. Van Daan is ashamed and Mrs. Frank regrets her words", "w": ["Mrs. Frank still insists that the Van Daans must leave", "Dussel and Mr. Van Daan start a new fight about food", "Everyone stops speaking to Mr. Van Daan for good"], "hint": "Hope changes how people see their anger.", "why": "The hope of freedom calms everyone down. Mr. Van Daan breaks down and says he is ashamed, and Mrs. Frank regrets what she said.", "ref": "Act 2 · Scene 3"}, {"q": "How does Anne try to help Peter in Act 2, Scene 4?", "a": "She tells him the world may be going through a phase and people are good at heart", "w": ["She tells him to stop talking and leave her alone at the window", "She promises him that Miep will come to rescue them that night", "She tells him to ask his father for one of the cigarettes"], "hint": "Anne answers his bitterness with hope.", "why": "Anne says, \"I think the world may be going through a phase,\" and that she still believes people are really good at heart.", "ref": "Act 2 · Scene 4"}], "quotes": [{"q": "\"What's the use of torturing yourself like this?\" Who says this, and why?", "a": "Miep, because coming back to the annex fills Mr. Frank with painful memories", "w": ["Mr. Frank, because Anne keeps asking him questions about the war", "Mrs. Frank, because Anne refuses to stop writing in her diary", "Peter, because Anne keeps teasing him about his cat"], "hint": "It is said in Act 1, Scene 1, in 1945.", "why": "Miep sees Mr. Frank suffering among the memories of his family and wants him to stop hurting himself.", "ref": "Act 1 · Scene 1"}, {"q": "\"No locks that anyone can put on your mind.\" What does Mr. Frank mean?", "a": "Anne's thoughts and imagination can stay free even though her body is trapped", "w": ["The annex has no locks, so nobody can lock the families inside", "Anne should always lock her diary so that nobody reads it", "The Nazis can never find out what the families are thinking"], "hint": "He is talking about a different kind of freedom.", "why": "Mr. Frank comforts Anne: she can still read, think and imagine. Her mind stays free.", "ref": "Act 1 · Scene 2"}, {"q": "\"A man likes a girl who'll listen to him once in a while.\" What does this show about Mr. Van Daan?", "a": "He thinks girls should be quiet and listen, and he finds Anne too talkative", "w": ["He is kind and wants to help Anne become a better listener at school", "He is lonely and wants Anne to come and talk to him more often", "He is proud of how clever and lively Anne has become in hiding"], "hint": "What does he want Anne to do less of?", "why": "Mr. Van Daan has old-fashioned ideas about girls and is irritated by Anne's lively talk.", "ref": "Act 1 · Scene 3"}, {"q": "\"You are the most intolerable, insufferable boy I've ever met!\" What does this show about Anne and Peter at this point?", "a": "They clash and annoy each other in Act 1", "w": ["They are already in love with each other", "They have never spoken to each other before", "They are united against Mr. Van Daan"], "hint": "This is Act 1, Scene 3, long before their friendship.", "why": "In Act 1 Peter teases Anne and she is furious. This makes their later closeness in Act 2 a big change.", "ref": "Act 1 · Scene 3"}, {"q": "\"We're trying to hold onto some kind of ideals.\" Who says this, and what does it show?", "a": "Anne; the young people are fighting to keep their hopes in a world the adults ruined", "w": ["Mr. Frank; he wants the adults to stop arguing about money and food", "Peter; he wants to become a soldier and fight against the Nazis", "Margot; she has decided to give up her plans for the future"], "hint": "It comes from an angry outburst in Act 2, Scene 1.", "why": "Anne feels the young people suffer for the adults' mistakes but are still trying to believe in goodness.", "ref": "Act 2 · Scene 1"}, {"q": "\"Offer him half.\" What does Mr. Frank's decision show?", "a": "He is practical and tries to keep everyone safe without panicking", "w": ["He is greedy and doesn't want to pay Carl the full amount", "He is angry and wants Mr. Kraler to fire Carl at once", "He is careless and doesn't think Carl is any danger"], "hint": "Carl's demand looks like blackmail.", "why": "Mr. Frank makes a calm, practical choice to protect everyone from a dangerous man.", "ref": "Act 2 · Scene 1"}, {"q": "\"Take your things and get out!\" What does this line show about Mrs. Frank?", "a": "She can be fierce when the children's survival is threatened", "w": ["She has always disliked the Van Daans from the very start", "She is joking to calm everyone down in the middle of the night", "She wants to leave the annex herself with her two daughters"], "hint": "She has just caught Mr. Van Daan taking bread.", "why": "Gentle Mrs. Frank explodes because stolen bread means hungry children.", "ref": "Act 2 · Scene 3"}, {"q": "\"For the past two years we have lived in fear. Now we can live in hope.\" When does Mr. Frank say this, and why?", "a": "When the police arrive; he gives his family courage at the worst moment", "w": ["When Miep brings the invasion news; he wants everyone to celebrate", "At Hanukkah; he wants the children to enjoy the holiday", "In 1945; he is telling Miep that the war is over"], "hint": "It is said at the end of Act 2, Scene 4.", "why": "Even as the police break in, Mr. Frank comforts his family. The waiting in fear is over.", "ref": "Act 2 · Scene 4"}, {"q": "\"I think the world may be going through a phase.\" What does Anne mean?", "a": "The cruelty of the war won't last forever, and good times will come back", "w": ["The world is ending and nothing can save it now", "She has grown tired of the war and wants to forget it", "Peter is going through a bad mood that will pass soon"], "hint": "A phase is a stage that passes.", "why": "Anne believes the evil of the war is a passing stage. She keeps hope, unlike Peter.", "ref": "Act 2 · Scene 4"}, {"q": "At the end of the play, Mr. Frank reads that Anne believes \"people are really good at heart\" and says, \"She puts me to shame.\" Why?", "a": "After everything, Anne still kept faith in people, and he struggles to", "w": ["Anne wrote that he was a bad father who never listened to her", "Anne's diary shows that she broke many of the annex rules", "He is ashamed that he was the one who chose the hiding place"], "hint": "Think about what Mr. Frank has lost.", "why": "Anne kept hope and faith in people despite everything. Mr. Frank, who lost his whole family, finds this hard to match.", "ref": "Act 2 · Scene 5"}], "timeline": ["Mr. Frank returns to the empty annex and Miep gives him Anne's diary.", "The families arrive in the annex and Peter tears off his star.", "Mr. Dussel moves into the annex.", "Anne has a nightmare about the Green Police.", "A thief interrupts the Hanukkah celebration.", "Miep brings a cake that says \"Peace in nineteen forty-four.\"", "Peter kisses Anne on the cheek.", "Mrs. Frank catches Mr. Van Daan stealing bread.", "Miep shouts, \"The invasion has begun!\"", "The police break into the annex."], "qwrite": [{"speaker": "Mrs. Frank", "ref": "Act 1 · Scene 3", "quote": "I'm afraid for other people, that you'll walk on them.", "task": "What does this line show about Anne and about her mother? Start with \"This shows...\"", "keys": [["anne"], ["rude", "careless", "hurt", "selfish", "thoughtless", "loud", "harsh"], ["mother", "mrs. frank", "worr", "afraid", "fear"]], "need": 2, "model": "This shows that Mrs. Frank worries about Anne's behavior. She thinks Anne is so outspoken and careless that she may hurt the feelings of the other people in the crowded annex. It also shows the tension between them: Anne feels criticized, while her mother is really trying to teach her to think about others."}, {"speaker": "Mr. Frank", "ref": "Act 1 · Scene 2", "quote": "no locks that anyone can put on your mind.", "task": "Why does Mr. Frank say this to Anne? What does it show about him?", "keys": [["mind", "think", "imagin", "thought", "read", "free"], ["trap", "hid", "lock", "can't go", "cannot go", "inside"], ["comfort", "kind", "wise", "hope", "calm", "help"]], "need": 2, "model": "Mr. Frank says this when Anne realizes she can never leave the annex. He means that even though her body is trapped, her mind is still free to read, think and imagine. This shows that he is a wise and caring father who helps Anne find hope in a frightening situation."}, {"speaker": "Anne", "ref": "Act 2 · Scene 1", "quote": "We're trying to hold onto some kind of ideals.", "task": "What is Anne saying about the young people in the annex? How does she feel?", "keys": [["young", "teen", "children", "we"], ["ideal", "hope", "belie", "good"], ["angry", "frustrat", "blame", "adult", "unfair"]], "need": 2, "model": "Anne is saying that the young people are trying to keep their hopes and their belief in goodness, even though the war is destroying everything around them. She feels angry and frustrated, because she believes the adults made the world this way and the young people have to suffer for it."}, {"speaker": "Mr. Frank", "ref": "Act 2 · Scene 3", "quote": "We don't need the Nazis to destroy us. We're destroying ourselves.", "task": "What does Mr. Frank mean? What is happening in the annex at this moment?", "keys": [["fight", "argu", "quarrel", "anger", "turn"], ["bread", "steal", "theft", "van daan", "food"], ["together", "group", "inside", "each other", "ourselves", "destroy"]], "need": 2, "model": "Mr. Frank means that the people in the annex are hurting each other as much as the Nazis could. Mrs. Frank has just caught Mr. Van Daan stealing bread and wants the Van Daans to leave. Mr. Frank warns that if hunger and anger turn them against each other, the group will fall apart."}, {"speaker": "Anne", "ref": "Act 2 · Scene 3", "quote": "Look at me, the way I've treated Mother.", "task": "What does this line show about how Anne has changed?", "keys": [["mother", "mrs. frank"], ["chang", "grow", "matur", "realiz", "understand", "regret", "sorry", "ashamed"], ["rude", "mean", "unfair", "treat", "behav"]], "need": 2, "model": "This line shows that Anne has matured. In Act 1 she was rude to her mother and told her father she loved only him. Now she looks at her own behavior and realizes she has treated her mother unfairly. Being able to admit your own faults is a clear sign of growing up."}, {"speaker": "Peter", "ref": "Act 2 · Scene 4", "quote": "and all for what?", "task": "How does Peter feel here, and how is his attitude different from Anne's?", "keys": [["peter"], ["hopeless", "bitter", "angry", "despair", "no hope", "pointless", "meaning"], ["anne", "hope", "good at heart", "phase"]], "need": 2, "model": "Peter feels angry and hopeless. After two years in hiding he cannot see any meaning in their suffering. His attitude is the opposite of Anne's: she still believes the world may be going through a phase and that people are really good at heart, while Peter has lost hope."}, {"speaker": "Mr. Frank", "ref": "Act 2 · Scene 4", "quote": "For the past two years we have lived in fear. Now we can live in hope.", "task": "Why is this line surprising at this moment? What does it show about Mr. Frank?", "keys": [["police", "arrest", "discover", "caught", "found"], ["calm", "brave", "courage", "comfort", "strong", "hope"], ["family", "everyone", "others", "children"]], "need": 2, "model": "The line is surprising because Mr. Frank says it just as the police break into the annex, the moment they feared most. He chooses hope instead of panic to give his family courage. It shows that he is a calm, brave leader who protects the others even at the worst moment."}, {"speaker": "Mr. Frank", "ref": "Act 2 · Scene 5", "quote": "She puts me to shame.", "task": "Why does Mr. Frank say this after reading Anne's words that people are really good at heart?", "keys": [["anne"], ["hope", "faith", "believ", "good at heart", "good"], ["lost", "suffer", "despite", "after everything", "died", "family", "hard"]], "need": 2, "model": "Mr. Frank has lost his whole family, so it is hard for him to believe in the goodness of people. Anne went through the same suffering but still kept her faith and hope. Her words make him feel ashamed of his own bitterness and remind him of how strong she was."}], "lessons": [{"title": "The parts of an essay", "body": [["Introduction", "Opens the essay. It has a <b>hook<\/b> (an interesting first sentence), a little <b>background<\/b> (the title, the playwrights, what the play is about) and, at the very end, the <b>thesis statement<\/b>."], ["Body paragraphs", "Usually two or three. Each one proves <b>one point<\/b> from your thesis, and each one is built with <b>PEEL<\/b>."], ["Conclusion", "Ends the essay. It <b>restates the thesis in new words<\/b>, sums up the main points and finishes with a <b>final thought<\/b>. It never brings in new evidence."]]}, {"title": "The thesis statement", "body": [["What it is", "One sentence, at the end of the introduction, that answers the essay question and tells the reader exactly what your essay will prove."], ["Clear and specific", "A strong thesis names the character or topic, makes a claim, and lists <b>two or three specific points<\/b>, one for each body paragraph."], ["Weak thesis", "<i>The Diary of Anne Frank is a play about a girl in hiding.<\/i> This is only a fact. It makes no claim and gives no points."], ["Strong thesis", "<i>In The Diary of Anne Frank, Anne grows from a careless, outspoken girl into a thoughtful young woman as she learns to see her own faults, to care deeply for Peter and to keep her hope in people.<\/i>"]]}, {"title": "PEEL: building a body paragraph", "body": [["P · Point", "The topic sentence. It answers the question and states the one idea this paragraph will prove. <i>Mr. Frank is a calm leader who keeps the group together.<\/i>"], ["E · Evidence", "A quotation or a specific example from the playscript, introduced with context and the act and scene. <i>When the group turns on Mr. Van Daan in Act 2, Scene 3, Mr. Frank warns, \"We don't need the Nazis to destroy us. We're destroying ourselves.\"<\/i>"], ["E · Explain", "Say what the evidence shows and why it proves your point. Use phrases like <i>This shows that…<\/i>, <i>This suggests…<\/i>, <i>The word … reveals…<\/i>"], ["L · Link", "Link back to the question or the thesis to close the paragraph. <i>Therefore, Mr. Frank's calm wisdom is what holds the frightened group together.<\/i>"]]}], "essayQuiz": [{"q": "What is the job of the Point (P) in a PEEL paragraph?", "a": "It states the one main idea the paragraph will prove", "w": ["It gives a quotation from the playscript as proof", "It explains what the quotation shows to the reader", "It sums up the whole essay in a final sentence"], "hint": "It is the first sentence of the paragraph.", "why": "The Point is the topic sentence: it answers the question with one clear idea.", "ref": "Essay skills"}, {"q": "Which sentence would make the best Point for the question \"How does Anne change in the play?\"", "a": "Anne grows from a careless girl into a young woman who can see her own faults.", "w": ["Anne Frank was born in Germany and later moved to Amsterdam with her family.", "In Act 2, Scene 3, Anne says, \"Look at me, the way I've treated Mother.\"", "This shows that Anne finally understands how much she hurt her mother."], "hint": "A Point makes a claim that answers the question; it is not a fact, a quote or an explanation.", "why": "It answers the question with a clear claim. The others are a background fact, Evidence and Explain sentences.", "ref": "Essay skills"}, {"q": "Which sentence is Evidence?", "a": "In Act 2, Scene 4, Anne says that she still believes \"people are really good at heart.\"", "w": ["Anne is the most hopeful character in the whole play, even at the end.", "This suggests that Anne refuses to let the war destroy her faith in people.", "Therefore, Anne's hope is what makes her such an inspiring character."], "hint": "Evidence comes from the playscript and says where it is from.", "why": "It gives a quotation with its act and scene. The others are a Point, an Explain and a Link.", "ref": "Essay skills"}, {"q": "Which sentence is an Explain sentence?", "a": "This shows that Mrs. Frank will fight fiercely to protect the children's food.", "w": ["Mrs. Frank is usually a quiet and gentle mother throughout Act 1 of the play.", "In Act 2, Scene 3, Mrs. Frank shouts, \"Take your things and get out!\"", "To conclude, Mrs. Frank is the character who changes the most suddenly."], "hint": "Explain sentences tell the reader what the evidence shows.", "why": "\"This shows that…\" explains the meaning of the evidence.", "ref": "Essay skills"}, {"q": "What does the Link (L) do?", "a": "It connects the paragraph back to the question or thesis", "w": ["It introduces a new quotation from a different scene", "It tells the reader what the next paragraph will be about", "It gives a fact about the playwrights' own lives"], "hint": "It is the last sentence of the paragraph.", "why": "The Link closes the paragraph by tying the point back to the question.", "ref": "Essay skills"}, {"q": "How should you introduce a quotation as evidence?", "a": "Give the context and the act and scene, then the exact words in quotation marks", "w": ["Write the quotation alone on a new line with no explanation before or after", "Change the words of the quotation so that it fits your point better", "Write \"I found this quote\" and then copy the longest speech you can find"], "hint": "Your reader needs to know who says it, when, and the exact words.", "why": "Strong evidence is introduced with context, uses the exact words in quotation marks and names the act and scene.", "ref": "Essay skills"}, {"q": "Where does the thesis statement go?", "a": "At the end of the introduction", "w": ["At the start of the conclusion", "In every body paragraph", "Before the hook"], "hint": "It is the last sentence before the body paragraphs begin.", "why": "The thesis is the last sentence of the introduction. It leads straight into the body paragraphs.", "ref": "Essay skills"}, {"q": "Which is the strongest thesis statement?", "a": "Mr. Frank is the true leader of the annex because he stays calm, makes peace between the others and gives them hope.", "w": ["Mr. Frank is a character in The Diary of Anne Frank, which was written by Frances Goodrich and Albert Hackett.", "In this essay I am going to write about Mr. Frank and some of the things that he does in the play.", "Mr. Frank is a good character and there are many good things about him that people can see."], "hint": "Look for a clear claim plus specific points.", "why": "It makes a clear claim and gives three specific points, one for each body paragraph. The others are a fact, an announcement and a vague opinion.", "ref": "Essay skills"}, {"q": "What is wrong with this thesis: \"The Diary of Anne Frank is a play about a Jewish family hiding during World War II\"?", "a": "It only states a fact; it makes no claim and gives no points", "w": ["It is too long and has too many specific points in it", "It uses quotation marks, which a thesis must never use", "It mentions the war, which belongs only in the conclusion"], "hint": "Can anyone disagree with it? Does it tell us what the essay will prove?", "why": "A thesis must make an arguable claim with specific points. A plain fact gives the essay nothing to prove.", "ref": "Essay skills"}, {"q": "Which is the correct order of the parts of an essay?", "a": "Introduction → body paragraphs → conclusion", "w": ["Thesis → conclusion → body paragraphs", "Body paragraphs → introduction → conclusion", "Hook → conclusion → introduction"], "hint": "Think about how an essay begins and ends.", "why": "An essay opens with the introduction, proves its points in the body paragraphs and ends with the conclusion.", "ref": "Essay skills"}, {"q": "What belongs in a conclusion?", "a": "The thesis restated in new words, a summary of the points and a final thought", "w": ["A brand new quotation and a new point that was not in the essay", "The same thesis copied word for word, with nothing added", "A list of every character's name and what they look like"], "hint": "A conclusion closes the essay; it does not open new arguments.", "why": "Restate the thesis in new words, sum up your points and end with a final thought. Never add new evidence.", "ref": "Essay skills"}, {"q": "What is the job of the hook?", "a": "To catch the reader's interest in the first sentence", "w": ["To give the main quotation that proves the thesis", "To list the points of each body paragraph in order", "To repeat the essay question word for word"], "hint": "It is the very first sentence of the essay.", "why": "The hook makes the reader want to keep reading: a question, a striking fact or a powerful idea.", "ref": "Essay skills"}], "label": [{"question": "How is Mr. Frank a good leader in the annex?", "sentences": [["P", "Mr. Frank is a wise leader who tries to stop the group from tearing itself apart."], ["E1", "When Mrs. Frank catches Mr. Van Daan stealing bread in Act 2, Scene 3, Mr. Frank warns everyone, \"We don't need the Nazis to destroy us. We're destroying ourselves.\""], ["E2", "This shows that he understands the real danger of their anger: if they turn against each other, the group will collapse even before the Nazis find them."], ["E2", "Instead of taking sides, he reminds them that they need each other to survive."], ["L", "Therefore, Mr. Frank's calm wisdom is what holds the frightened group together."]]}, {"question": "How does Anne change during the play?", "sentences": [["P", "By Act 2, Anne has grown into a young woman who can judge her own behavior."], ["E1", "After the fight over the stolen bread, she admits, \"Look at me, the way I've treated Mother.\""], ["E2", "This suggests that Anne finally sees how unfair she has been to her mother, whom she pushed away after her nightmare in Act 1."], ["E2", "Being able to admit your own faults is a clear sign of maturity."], ["L", "This change shows that the hard years in hiding have helped Anne grow up."]]}], "thesis": [{"prompt": "How does Anne change during the play?", "subject": ["anne"], "model": "In The Diary of Anne Frank, Anne changes from a loud, careless girl into a thoughtful young woman as she learns to see her own faults, to share her feelings with Peter and to keep her hope in people."}, {"prompt": "How does the fear of being discovered affect the people in the annex?", "subject": ["fear", "afraid", "annex", "people", "families", "discover"], "model": "In The Diary of Anne Frank, the constant fear of being discovered makes the people in the annex suspicious of each other, causes angry fights over food, and yet also shows their courage and hope."}, {"prompt": "Who is the most important helper of the families, and why?", "subject": ["miep", "kraler", "helper"], "model": "In The Diary of Anne Frank, Miep is the most important helper because she risks her life to bring food, she brings hope with her news, and she saves Anne's diary after the arrest."}], "peel": [{"prompt": "How does Anne change during the play?", "keyword": ["anne", "chang", "grow", "matur"], "bank": [["Anne", "Act 2 · Scene 3", "Look at me, the way I've treated Mother."], ["Anne", "Act 2 · Scene 4", "I think the world may be going through a phase"], ["Anne", "Act 2 · Scene 4", "people are really good at heart."], ["Anne", "Act 1 · Scene 3", "You are the most intolerable, insufferable boy I've ever met!"]], "model": ["Anne grows from a careless, outspoken girl into a young woman who can judge her own behavior.", "In Act 2, Scene 3, after the fight over the stolen bread, Anne admits, \"Look at me, the way I've treated Mother.\"", "This shows that Anne finally understands how unfair she has been to her mother, whom she pushed away in Act 1. Being able to see your own faults is a clear sign of growing up.", "Therefore, the years in hiding change Anne into a more mature and thoughtful person."]}, {"prompt": "How does the fear of being discovered affect the people in the annex?", "keyword": ["fear", "afraid", "discover", "annex", "tension", "pressure"], "bank": [["Mr. Frank", "Act 2 · Scene 3", "We don't need the Nazis to destroy us. We're destroying ourselves."], ["Mrs. Frank", "Act 2 · Scene 3", "Take your things and get out!"], ["Margot", "Act 2 · Scene 1", "Sometimes I wish the end would come . . . whatever it is."], ["Mr. Frank", "Act 2 · Scene 4", "For the past two years we have lived in fear. Now we can live in hope."]], "model": ["The constant fear of being discovered wears the people in the annex down and turns them against one another.", "In Act 2, Scene 1, after hearing that a worker may be blackmailing them, Margot says, \"Sometimes I wish the end would come . . . whatever it is.\"", "This suggests that the fear has become so heavy that even calm, quiet Margot would rather face the end than keep waiting. The words \"whatever it is\" show that she has almost stopped caring what happens.", "Therefore, the fear of discovery damages the spirit of the people in the annex as much as hunger does."]}]}</script>

/* ---------- storage (safe) ---------- */
function load(k,d){try{var v=localStorage.getItem(KEY+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function h(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild}
function words(s){return (s.trim().match(/[A-Za-z’'-]+/g)||[]).length}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' -]/g," ").replace(/[\s-]+/g," ").trim()}
function gapify(q){return esc(q).replace(/_{4,}/g,'<span class="gap"></span>')}
function top(title,back){return '<div class="top"><button class="back" data-go="'+back+'">← Back</button><span class="t">'+esc(title)+'</span><img class="mini" src="'+LOGO+'" alt="Onur English"></div>'}
function go(route){location.hash=route}

/* ---------- activity registry ---------- */
var A={};
function reg(id,o){o.id=id;A[id]=o}
// Vocabulary
function vocabItems(f){return D.vocab.filter(function(v){return f==="all"||v.scene.indexOf(f)===0})}
["all","Act 1","Act 2"].forEach(function(f){
  var tag=f==="all"?"all":f.replace(" ","").toLowerCase();
  reg("vmc-"+tag,{chapter:"vocab",kind:"mc",title:"Choose the word"+(f==="all"?"":" · "+f),
    items:vocabItems(f).map(function(v){var m=v.mc;return {q:m.q,a:m.a,w:m.w,hint:m.hint,why:m.why,ref:v.scene}})});
  reg("vwr-"+tag,{chapter:"vocab",kind:"type",title:"Write the word"+(f==="all"?"":" · "+f),
    items:vocabItems(f).map(function(v){var w=v.wr;return {s:w.s,first:w.first,accept:w.accept,hint:w.hint,word:v.word,ref:v.scene}})});
});

function status(id){
  var a=A[id], s=load("st:"+id,null);
  if(a.kind==="learn") return load("learned",false)?{done:true,label:"Read ✓"}:{done:false,label:"Read me first"};
  if(a.kind==="timeline") return s&&s.done?{done:true,label:"Done ✓"}:{done:false,label:"10 events"};
  if(a.kind==="qwrite"){var d=load("qw",{});var n=Object.keys(d).filter(function(k){return d[k].ok}).length;return {done:n>=D.qwrite.length,label:n+" / "+D.qwrite.length+" written"}}
  if(a.kind==="label"){var l=load("lab",{});var t=0,c=0;D.label.forEach(function(p,pi){p.sentences.forEach(function(x,si){t++;if(l[pi+"-"+si])c++})});return {done:c===t,label:c+" / "+t+" labeled"}}
  if(a.kind==="thesis"){var th=load("th",{});var m=D.thesis.filter(function(x,i){return th[i]&&th[i].ok}).length;return {done:m===D.thesis.length,label:m+" / "+D.thesis.length+" theses"}}
  if(a.kind==="peel"){var pe=load("pe",{});var k=D.peel.filter(function(x,i){return pe[i]&&pe[i].ok}).length;return {done:k===D.peel.length,label:k+" / "+D.peel.length+" paragraphs"}}
  var n2=a.mix?25:a.items.length;
  if(s&&s.finished) return {done:true,label:"Best "+s.best+"/"+n2};
  if(s&&s.st) return {done:false,label:"In progress"};
  return {done:false,label:n2+" questions"};
}

/* ---------- home ---------- */
function home(){
  var all=[];Object.keys(CH).forEach(function(c){if(c!=="mix")all=all.concat(CH[c].acts)});
  var done=all.filter(function(id){return status(id).done}).length;
  var html='<div class="cover"><div class="band gingham"></div>'+
   '<div class="label"><img class="logo" src="'+LOGO+'" alt="Onur English"><div class="type" style="font-size:12px;color:var(--red);letter-spacing:.12em">GRADE 8 · EXAM STUDY GUIDE</div>'+
   '<h1>The Diary of Anne&nbsp;Frank</h1><div class="sub">The play by Frances Goodrich &amp; Albert Hackett · Acts 1 &amp; 2</div></div><div style="height:16px"></div></div>'+
   '<div class="wrap"><div class="meter"><span class="type">Pages filled</span><span class="bar"><i style="width:'+Math.round(done/all.length*100)+'%"></i></span><b>'+done+' / '+all.length+'</b></div>'+
   '<div class="note">Every part is open. Start anywhere. Questions you miss come back in the next round until you get them right.</div><div class="chapters">';
  Object.keys(CH).forEach(function(c){var ch=CH[c];
    var dots=ch.acts.map(function(id){return '<b class="'+(status(id).done?"on":"")+'"></b>'}).join("");
    html+='<button class="chap'+(c==="mix"?" wide":"")+'" style="--c:'+ch.c+'" data-go="ch/'+c+'"><div class="kick type">'+ch.n+'</div><h2>'+ch.title+'</h2><p>'+ch.blurb+'</p><div class="dots">'+dots+'</div></button>'});
  html+='</div><div class="foot"><img src="'+LOGO+'" alt=""><br>Onur English</div></div>';
  app.innerHTML=html;
}

/* ---------- chapter ---------- */
function chapter(c){
  var ch=CH[c];
  if(c==="mix"){return runMC("mix")}
  var html='<div class="wrap">'+top(ch.title,"")+'<div class="vhead"><div class="kick type" style="color:'+ch.c+'">'+ch.n+'</div><h2>'+ch.title+'</h2><p>'+ch.blurb+'</p></div>';
  if(c==="vocab"){
    html+='<div class="group-h">Step 1 · Choose the word</div><div class="filters">'+
      [["vmc-all","All 46 words"],["vmc-act1","Act 1 only"],["vmc-act2","Act 2 only"]].map(function(x){return '<button class="chip" data-go="a/'+x[0]+'">'+x[1]+' · '+esc(status(x[0]).label)+'</button>'}).join("")+'</div>'+
      '<div class="group-h">Step 2 · Write the word (first letter given)</div><div class="filters">'+
      [["vwr-all","All 46 words"],["vwr-act1","Act 1 only"],["vwr-act2","Act 2 only"]].map(function(x){return '<button class="chip" data-go="a/'+x[0]+'">'+x[1]+' · '+esc(status(x[0]).label)+'</button>'}).join("")+'</div>'+
      '<div class="group-h">Word list from your booklet</div><div class="page" style="background-image:none"><div style="font-size:15px;line-height:1.7">'+
      groupWords()+'</div></div>';
  } else {
    html+='<div class="acts">';
    ch.acts.forEach(function(id,i){var s=status(id);
      html+='<button class="act" data-go="a/'+id+'"><span class="n" style="background:'+ch.c+'1f;color:'+ch.c+'">'+(i+1)+'</span><span class="x"><b>'+esc(A[id].title)+'</b><span>'+desc(id)+'</span></span><span class="st'+(s.done?" done":"")+'">'+esc(s.label)+'</span></button>'});
    html+='</div>';
  }
  html+='</div>';
  app.innerHTML=html;
}
function groupWords(){var by={};D.vocab.forEach(function(v){(by[v.scene]=by[v.scene]||[]).push(v.word)});
  return Object.keys(by).map(function(s){return '<div><span class="type" style="color:var(--red);font-size:13px">'+esc(s)+'</span><br>'+by[s].map(esc).join(" · ")+'</div>'}).join('<div style="height:8px"></div>')}
function desc(id){return {events:"Act 1 and Act 2, scene by scene",chars:"Anne, the Franks, the Van Daans, Dussel, the helpers",conf:"External and internal conflicts",att:"How the characters treat each other",quotes:"Who said it, and what does it show?",timeline:"Tap the events in the order they happen",qwrite:"Tap a line and write what it shows",learn:"Read this before the quiz",equiz:"PEEL, thesis and essay parts",label:"Tap each sentence and name its job",thesis:"Write clear, specific thesis statements",peel:"Pick a quote and build a full paragraph"}[id]||""}

/* ---------- multiple choice / typed mastery engine ---------- */
function newState(a){var n=a.items.length;var ord=[];for(var i=0;i<n;i++)ord.push(i);

              [words(L)>=6&&(/\b(therefore|thus|overall|this proves|this is why|in conclusion|clearly)\b/.test(L)||x.keyword.some(function(k){return L.indexOf(k)>=0})),"Link: ties back to the question (therefore… / overall…)"] ];
      var ok=c.every(function(z){return z[0]});d.ok=d.ok||ok;save("pe",pe);
      document.getElementById("out").innerHTML='<ul class="checks">'+c.map(function(z){return '<li class="'+(z[0]?"y":"n")+'">'+z[1]+'</li>'}).join("")+'</ul>'+(ok?'<div class="fb ok"><b class="h">Excellent PEEL paragraph!</b>Compare it with the model.</div>':'<div class="fb no"><b class="h">Keep going.</b>Fix the parts marked ✗ and check again.</div>')+peelModel(x.model)};
    document.getElementById("md").onclick=function(){document.getElementById("out").innerHTML=peelModel(x.model)};
  }
  render();
}
function peelModel(m){var k=["P","E1","E2","L"];return '<div class="model"><span class="hand">Model paragraph</span>'+m.map(function(s,i){return '<span class="tag '+LBL[k[i]][1]+'" style="display:inline-block;color:#fff;font-family:Fraunces,serif;font-weight:700;font-size:12px;border-radius:5px;padding:0 6px;margin-right:4px">'+LBL[k[i]][0]+'</span>'+esc(s)}).join(" ")+'</div>'}

/* ---------- router ---------- */
function route(){
  var r=(location.hash||"#").slice(1);
  if(!r)return home();
  var p=r.split("/");
  if(p[0]==="ch"&&CH[p[1]])return chapter(p[1]);
  if(p[0]==="a"&&A[p[1]]){var a=A[p[1]];
    if(a.kind==="mc"||a.kind==="type")return runMC(a.id);
    if(a.kind==="timeline")return runTimeline();
    if(a.kind==="qwrite")return runQWrite();
    if(a.kind==="learn")return runLearn();
    if(a.kind==="label")return runLabel();
    if(a.kind==="thesis")return runThesis();
    if(a.kind==="peel")return runPeel();}
  home();
}
document.addEventListener("click",function(e){var t=e.target.closest("[data-go]");if(t){e.preventDefault();var g=t.getAttribute("data-go");if(("#"+g)===location.hash||(!g&&!location.hash))route();else go(g);window.scrollTo(0,0)}});
window.addEventListener("hashchange",function(){route();window.scrollTo(0,0)});
route();
})();
</script>
